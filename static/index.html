<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TravelBlog Pro v10</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0f1a;--sf:#151929;--sf2:#1d2340;--sf3:#252d4a;--bd:#2a3459;--fg:#e8ecf4;--fg2:#8b95b0;--fg3:#5a6380;--pri:#6366f1;--pri2:#4f46e5;--pri-glow:rgba(99,102,241,.15);--ok:#10b981;--warn:#f59e0b;--err:#ef4444;--olive:#8B9467;--radius:12px;--font:'Noto Sans KR',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--fg);height:100vh;overflow:hidden}
.app{display:grid;grid-template-rows:52px 1fr;grid-template-columns:1fr 1fr;height:100vh}
.header{grid-column:1/-1;background:var(--sf);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 20px;gap:12px}
.logo{font-size:15px;font-weight:700;background:linear-gradient(135deg,var(--pri),#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.steps{display:flex;gap:3px;margin-left:16px}
.step-btn{padding:5px 14px;border-radius:18px;font-size:11px;font-weight:500;border:1px solid var(--bd);background:transparent;color:var(--fg3);cursor:pointer;transition:all .2s}
.step-btn:hover{border-color:var(--fg3);color:var(--fg2)}
.step-btn.active{background:var(--pri);border-color:var(--pri);color:#fff}
.step-btn.done{border-color:var(--ok);color:var(--ok)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.settings-btn{padding:5px 12px;border-radius:8px;font-size:11px;border:1px solid var(--bd);background:transparent;color:var(--fg2);cursor:pointer}
.settings-btn:hover{border-color:var(--pri);color:var(--pri)}
.status-pill{font-size:11px;padding:3px 10px;border-radius:10px;background:var(--sf2);color:var(--fg2);max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status-pill.busy{background:var(--pri-glow);color:var(--pri);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.editor{background:var(--sf);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden}
.editor-hdr{padding:12px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px}
.editor-title{font-size:13px;font-weight:600}
.editor-badge{font-size:10px;padding:2px 7px;border-radius:6px;background:var(--pri-glow);color:var(--pri)}
.editor-body{flex:1;overflow-y:auto;padding:12px 16px}
.editor-body::-webkit-scrollbar{width:5px}
.editor-body::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
.preview{background:#fff;display:flex;flex-direction:column;overflow:hidden}
.preview-hdr{padding:10px 16px;background:#f8f9fa;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:10px}
.preview-title{font-size:12px;font-weight:600;color:#374151}
.preview-badge{font-size:10px;padding:2px 7px;border-radius:6px;background:#ecfdf5;color:#059669}
.preview-body{flex:1;overflow-y:auto;padding:24px 32px}
.preview-body::-webkit-scrollbar{width:5px}
.preview-body::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:3px}
.preview-content{max-width:640px;margin:0 auto;font-family:var(--font);color:#333;line-height:1.8}
.preview-content img{max-width:100%;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.12)}
.card{background:var(--sf2);border:1px solid var(--bd);border-radius:var(--radius);padding:12px;margin-bottom:10px}
.card-label{font-size:10px;font-weight:600;color:var(--fg3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
input[type="text"],input[type="password"],textarea,select{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:7px;padding:8px 10px;color:var(--fg);font-family:var(--font);font-size:12px;outline:none;transition:border-color .2s}
input:focus,textarea:focus,select:focus{border-color:var(--pri)}
textarea{resize:vertical;min-height:50px;line-height:1.5}
.btn{padding:7px 14px;border-radius:7px;font-size:12px;font-weight:500;border:none;cursor:pointer;transition:all .15s;font-family:var(--font)}
.btn-pri{background:var(--pri);color:#fff}.btn-pri:hover{background:var(--pri2)}
.btn-ghost{background:transparent;border:1px solid var(--bd);color:var(--fg2)}.btn-ghost:hover{border-color:var(--fg3);color:var(--fg)}
.btn-sm{padding:4px 8px;font-size:10px}
.btn-ok{background:var(--ok);color:#fff}
.btn-warn{background:var(--warn);color:#000}
.btn-err{background:var(--err);color:#fff}
.block-item{background:var(--sf3);border:1px solid var(--bd);border-radius:7px;padding:8px 10px;margin-bottom:4px;cursor:pointer;transition:all .15s;position:relative}
.block-item:hover{border-color:var(--fg3)}
.block-item.selected{border-color:var(--pri);background:var(--pri-glow)}
.block-item .bt{font-size:9px;font-weight:600;color:var(--fg3);text-transform:uppercase;margin-bottom:2px}
.block-item .bc{font-size:11px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.block-item .ba{position:absolute;right:6px;top:50%;transform:translateY(-50%);display:none;gap:2px}
.block-item:hover .ba{display:flex}
.ba-btn{width:22px;height:22px;border-radius:4px;background:var(--bd);border:none;color:var(--fg2);cursor:pointer;font-size:10px;display:flex;align-items:center;justify-content:center}
.ba-btn:hover{background:var(--pri);color:#fff}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(55px,1fr));gap:3px}
.photo-thumb{aspect-ratio:1;border-radius:6px;overflow:hidden;border:1px solid var(--bd);cursor:pointer}
.photo-thumb img{width:100%;height:100%;object-fit:cover}
.dropzone{border:2px dashed var(--bd);border-radius:var(--radius);padding:32px;text-align:center;cursor:pointer;transition:all .2s}
.dropzone:hover{border-color:var(--pri);background:var(--pri-glow)}
.loading-overlay{position:fixed;inset:0;background:rgba(12,15,26,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px)}
.loading-spinner{width:36px;height:36px;border:3px solid var(--bd);border-top-color:var(--pri);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{margin-top:12px;font-size:13px;color:var(--fg2)}
.progress-bar{height:4px;background:var(--bd);border-radius:2px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;background:var(--pri);border-radius:2px;transition:width .3s}
.group-tabs{display:flex;gap:3px;margin-bottom:10px;flex-wrap:wrap}
.group-tab{padding:4px 12px;border-radius:6px;font-size:11px;border:1px solid var(--bd);background:transparent;color:var(--fg3);cursor:pointer}
.group-tab.active{background:var(--pri);border-color:var(--pri);color:#fff}
.group-tab.has-draft{border-color:var(--ok);color:var(--ok)}
.flex{display:flex}.gap-6{gap:6px}.gap-8{gap:8px}.items-center{align-items:center}.justify-between{justify-content:space-between}
.mt-6{margin-top:6px}.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}.mb-6{margin-bottom:6px}.mb-8{margin-bottom:8px}
.text-xs{font-size:10px}.text-sm{font-size:11px}.text-fg2{color:var(--fg2)}.text-fg3{color:var(--fg3)}
.w-full{width:100%}.hidden{display:none!important}
.color-input{width:36px;height:28px;border:1px solid var(--bd);border-radius:4px;background:var(--bg);cursor:pointer;padding:2px}
.settings-section{margin-bottom:16px}
.settings-section h3{font-size:12px;font-weight:600;color:var(--fg);margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--bd)}
.settings-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.settings-row label{font-size:11px;color:var(--fg2);flex-shrink:0;width:120px}
.settings-row .s-input{flex:1;min-width:0}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="header">
    <div class="logo">✈ TravelBlog Pro</div>
    <div class="steps" id="steps">
      <button class="step-btn active" data-step="1">1. 업로드</button>
      <button class="step-btn" data-step="2">2. 계획검수</button>
      <button class="step-btn" data-step="3">3. AI생성</button>
      <button class="step-btn" data-step="4">4. 편집</button>
      <button class="step-btn" data-step="5">5. 발행</button>
    </div>
    <div class="hdr-right">
      <button class="settings-btn" onclick="goSettings()">⚙️ 설정</button>
      <div class="status-pill" id="statusPill">준비</div>
    </div>
  </header>
  <div class="editor">
    <div class="editor-hdr"><span class="editor-title" id="editorTitle">📸 업로드</span><span class="editor-badge" id="editorBadge">STEP 1</span></div>
    <div class="editor-body" id="editorBody"></div>
  </div>
  <div class="preview">
    <div class="preview-hdr"><span class="preview-title">미리보기</span><span class="preview-badge">실시간</span></div>
    <div class="preview-body" id="previewBody">
      <div class="preview-content" id="previewContent">
        <div style="text-align:center;padding:60px 30px;color:#9ca3af">
          <p style="font-size:40px;margin-bottom:12px">✈</p>
          <p style="font-size:14px">사진을 업로드하면<br>블로그 미리보기가 표시됩니다</p>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="loading-overlay hidden" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-text" id="loadingText">처리 중...</div>
  <div class="progress-bar" style="width:200px;margin-top:10px"><div class="progress-fill" id="loadingProgress" style="width:0%"></div></div>
</div>

<script>
const API='';
// ── 상태 ──
let step=1, photos=[], groups=[], drafts=[], blocks=[], selBlock=-1;
let curGroup=0, curDraft=0, draftTitle='', draftTags=[];
let tripTitle='', selMode='by_place', placeMemos={}, routeModes={}, refUrls=[], planData=null;
let settings={}, pollTimer=null;

// ── DOM ──
const $eb=document.getElementById('editorBody'), $et=document.getElementById('editorTitle');
const $badge=document.getElementById('editorBadge'), $pc=document.getElementById('previewContent');
const $status=document.getElementById('statusPill');
const $loading=document.getElementById('loadingOverlay'), $lt=document.getElementById('loadingText'), $lp=document.getElementById('loadingProgress');

// ── 유틸 ──
function esc(s){return s?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}
function show(m){$loading.classList.remove('hidden');$lt.textContent=m;$lp.style.width='0%'}
function hide(){$loading.classList.add('hidden');stopPoll()}
function stat(t,b=false){$status.textContent=t;$status.classList.toggle('busy',b)}
function startPoll(cb){stopPoll();pollTimer=setInterval(async()=>{
  const r=await fetch(`${API}/api/status`);const d=await r.json();const p=d.progress;
  $lt.textContent=p.message;$lp.style.width=p.percent+'%';stat(p.message,p.status!=='done'&&p.status!=='error'&&p.status!=='idle');
  if(p.status==='done'||p.status==='error'){hide();if(cb)cb(p)}},800)}
function stopPoll(){if(pollTimer){clearInterval(pollTimer);pollTimer=null}}

// ── 네비 ──
document.querySelectorAll('.step-btn').forEach(b=>b.addEventListener('click',()=>go(+b.dataset.step)));
function go(n){step=n;document.querySelectorAll('.step-btn').forEach(b=>{b.classList.remove('active');if(+b.dataset.step===n)b.classList.add('active')});render()}
function render(){({'-1':renderProfileSelect,0:renderSettings,1:renderS1,2:renderS2,3:renderS3,4:renderS4,5:renderS5})[String(step)]?.()}

let profileName='';  // 현재 프로필명

// ── 프로필 선택 화면 (STEP -1) ──
async function renderProfileSelect(){
  $et.textContent='👤 프로필 선택';$badge.textContent='START';
  $pc.innerHTML=`<div style="text-align:center;padding:60px 30px;color:#9ca3af">
    <p style="font-size:40px;margin-bottom:12px">✈</p>
    <p style="font-size:16px;font-weight:600;color:#374151">TravelBlog Pro</p>
    <p style="font-size:13px;margin-top:8px">프로필을 선택하거나 새로 만들어주세요</p>
  </div>`;

  const r=await fetch(`${API}/api/profiles`);const d=await r.json();
  const profiles=d.profiles||[];const last=d.last_used||'';

  let h=`<div style="text-align:center;margin-bottom:20px">
    <div style="font-size:32px;margin-bottom:8px">✈</div>
    <div style="font-size:16px;font-weight:700;color:var(--fg)">TravelBlog Pro</div>
    <div class="text-sm text-fg2 mt-6">프로필을 선택하여 시작하세요</div>
  </div>`;

  if(profiles.length){
    h+=`<div class="card-label">저장된 프로필</div>`;
    profiles.forEach(p=>{
      const isLast=p.name===last;
      h+=`<div class="block-item ${isLast?'selected':''}" onclick="selectProfile('${esc(p.name)}')" style="margin-bottom:6px">
        <div class="flex items-center justify-between">
          <div>
            <div style="font-size:13px;font-weight:600;color:var(--fg)">${esc(p.name)} ${isLast?'<span class="text-xs" style="color:var(--ok)">(최근)</span>':''}</div>
            <div class="text-xs text-fg2 mt-6">${esc(p.tone)} · ${esc(p.mood)} · 참고URL ${p.ref_count}개</div>
            <div class="text-xs text-fg3">${esc(p.modified)}</div>
          </div>
          <div style="width:24px;height:24px;border-radius:50%;background:${p.accent_color||'#8B9467'}"></div>
        </div>
      </div>`});
  } else {
    h+=`<div class="card" style="text-align:center;padding:24px"><div class="text-sm text-fg2">저장된 프로필이 없습니다<br>새 프로필을 만들어주세요</div></div>`;
  }

  h+=`<button class="btn btn-pri w-full mt-16" onclick="newProfile()">+ 새 프로필 만들기</button>`;
  if(profiles.length){
    h+=`<div class="text-xs text-fg3 mt-8" style="text-align:center">프로필 클릭으로 바로 시작</div>`;
  }
  $eb.innerHTML=h;
}

async function selectProfile(name){
  stat('프로필 로드 중...',true);
  const r=await fetch(`${API}/api/profiles/${encodeURIComponent(name)}`);
  const d=await r.json();
  if(d.error){alert(d.error);return}
  settings=d;profileName=name;refUrls=d.ref_urls||[];
  stat(`✅ ${name} 프로필 로드`);
  go(1);
}

function newProfile(){
  profileName='';settings=JSON.parse(JSON.stringify(DEFAULT_SETTINGS));refUrls=[];
  go(0);
}

const DEFAULT_SETTINGS={
  blog_style:{tone:"친근 구어체",mood:"감성적",emoji_level:"적당히",photo_desc_length:"2~3줄",place_intro_length:"3~4줄",include_tips:true,include_outro:true},
  design:{accent_color:"#8B9467",separator_style:"─ ─ ─",place_label:"PLACE N",intro_style:"✈ 여행기 ✈"},
  ref_urls:[],api:{openai_key:"",openai_model:"gpt-4o-mini",google_key:"",naver_id:"",naver_pw:"",publish_method:"selenium",default_visibility:"비공개"},
  custom_prompt:{extra_instructions:"",banned_expressions:"",required_keywords:""}
};

// ── 설정 로드 ──
async function loadSettings(){
  try {
    const r=await fetch(`${API}/api/settings/raw`);
    settings=await r.json();
    refUrls=settings.ref_urls||[];
  } catch(e) {
    settings={};refUrls=[];
  }
}
loadSettings();

function goSettings(){go(-1)}

// ═══ STEP 0: 설정 ═══
function renderSettings(){
  $et.textContent='⚙️ 설정';$badge.textContent='SETTINGS';
  const s=settings;const bs=s.blog_style||{};const ds=s.design||{};const api=s.api||{};const cp=s.custom_prompt||{};

  // 우측: 설정 예시 미리보기
  updateSettingsPreview(bs, ds, cp);

  $eb.innerHTML=`
  <div class="card"><div class="card-label">프로필 이름</div><input type="text" id="s_name" value="${esc(profileName)}" placeholder="예: 내 여행블로그, 감성 스타일..."></div>
  <div class="settings-section"><h3>✍️ 블로그 스타일</h3>
    <div class="settings-row"><label>말투</label><div class="s-input"><select id="s_tone" onchange="updateSettingsPreviewLive()"><option ${bs.tone==='친근 구어체'?'selected':''}>친근 구어체</option><option ${bs.tone==='정중 존댓말'?'selected':''}>정중 존댓말</option><option ${bs.tone==='캐주얼 반말'?'selected':''}>캐주얼 반말</option></select></div></div>
    <div class="settings-row"><label>글 톤</label><div class="s-input"><select id="s_mood" onchange="updateSettingsPreviewLive()"><option ${bs.mood==='감성적'?'selected':''}>감성적</option><option ${bs.mood==='정보 위주'?'selected':''}>정보 위주</option><option ${bs.mood==='유머러스'?'selected':''}>유머러스</option></select></div></div>
    <div class="settings-row"><label>이모지 사용</label><div class="s-input"><select id="s_emoji" onchange="updateSettingsPreviewLive()"><option ${bs.emoji_level==='많이'?'selected':''}>많이</option><option ${bs.emoji_level==='적당히'?'selected':''}>적당히</option><option ${bs.emoji_level==='안 씀'?'selected':''}>안 씀</option></select></div></div>
    <div class="settings-row"><label>사진 설명 길이</label><div class="s-input"><select id="s_pdl"><option ${bs.photo_desc_length==='1~2줄'?'selected':''}>1~2줄</option><option ${bs.photo_desc_length==='2~3줄'?'selected':''}>2~3줄</option><option ${bs.photo_desc_length==='3~4줄'?'selected':''}>3~4줄</option></select></div></div>
    <div class="settings-row"><label>장소 소개 길이</label><div class="s-input"><select id="s_pil"><option ${bs.place_intro_length==='2~3줄'?'selected':''}>2~3줄</option><option ${bs.place_intro_length==='3~4줄'?'selected':''}>3~4줄</option><option ${bs.place_intro_length==='5줄+'?'selected':''}>5줄+</option></select></div></div>
    <div class="settings-row"><label>꿀팁 포함</label><div class="s-input"><select id="s_tips"><option value="true" ${bs.include_tips!==false?'selected':''}>포함</option><option value="false" ${bs.include_tips===false?'selected':''}>미포함</option></select></div></div>
    <div class="settings-row"><label>마무리 인사</label><div class="s-input"><select id="s_outro"><option value="true" ${bs.include_outro!==false?'selected':''}>포함</option><option value="false" ${bs.include_outro===false?'selected':''}>미포함</option></select></div></div>
  </div>
  <div class="settings-section"><h3>🎨 디자인</h3>
    <div class="settings-row"><label>포인트 색상</label><div class="s-input"><input type="color" id="s_color" value="${ds.accent_color||'#8B9467'}" class="color-input" onchange="updateSettingsPreviewLive()"></div></div>
    <div class="settings-row"><label>구분선 스타일</label><div class="s-input"><select id="s_sep" onchange="updateSettingsPreviewLive()"><option ${ds.separator_style==='─ ─ ─'?'selected':''}>─ ─ ─</option><option ${ds.separator_style==='━━━'?'selected':''}>━━━</option><option ${ds.separator_style==='· · ·'?'selected':''}>· · ·</option><option ${ds.separator_style==='없음'?'selected':''}>없음</option></select></div></div>
    <div class="settings-row"><label>장소 라벨</label><div class="s-input"><select id="s_label" onchange="updateSettingsPreviewLive()"><option ${ds.place_label==='PLACE N'?'selected':''}>PLACE N</option><option ${ds.place_label==='장소 N'?'selected':''}>장소 N</option><option ${ds.place_label==='없음'?'selected':''}>없음</option></select></div></div>
    <div class="settings-row"><label>인트로 스타일</label><div class="s-input"><select id="s_intro" onchange="updateSettingsPreviewLive()"><option ${ds.intro_style==='✈ 여행기 ✈'?'selected':''}>✈ 여행기 ✈</option><option ${ds.intro_style==='심플'?'selected':''}>심플</option><option ${ds.intro_style==='없음'?'selected':''}>없음</option></select></div></div>
  </div>
  <div class="settings-section"><h3>🔑 API / 계정</h3>
    <div class="settings-row"><label>OpenAI Key</label><div class="s-input"><input type="password" id="s_okey" value="${esc(api.openai_key||'')}" placeholder="sk-..."></div></div>

async function uploadFiles(files){
  const imgs=Array.from(files).filter(f=>f.type.startsWith('image/')||/\.(jpg|jpeg|png|gif|webp|heic)$/i.test(f.name));
  if(!imgs.length){alert('이미지 파일을 선택해주세요');return}
  stat(`${imgs.length}장 업로드 중...`,true);
  const c=document.getElementById('upPhotos');
  c.innerHTML=`<div class="text-xs text-fg3">${imgs.length}장 업로드 중...</div><div class="photo-grid" id="tg"></div>`;
  const tg=document.getElementById('tg');
  imgs.forEach(f=>{tg.innerHTML+=`<div class="photo-thumb"><img src="${URL.createObjectURL(f)}"></div>`});
  const fd=new FormData();imgs.forEach(f=>fd.append('photos',f));
  try{const r=await fetch(`${API}/api/upload`,{method:'POST',body:fd});const d=await r.json();
    stat(`✅ ${d.uploaded}장 업로드`);c.querySelector('.text-xs').textContent=`${d.uploaded}장 업로드 완료`;
    document.getElementById('anaBtn').classList.remove('hidden');
  }catch(e){stat('❌ 업로드 실패');c.innerHTML=`<div class="card" style="border-color:var(--err)"><div style="color:var(--err);font-size:12px">❌ ${esc(e.message)}<br><span class="text-xs text-fg3">python app.py 실행 확인</span></div></div>`}}

async function uploadReceipts(files){
  const imgs=Array.from(files).filter(f=>f.type.startsWith('image/'));
  if(!imgs.length){alert('이미지 파일을 선택해주세요');return}
  stat(`영수증 ${imgs.length}장 인식 중...`,true);
  const fd=new FormData();imgs.forEach(f=>fd.append('receipts',f));
  try{
    const r=await fetch(`${API}/api/receipts/upload`,{method:'POST',body:fd});
    const d=await r.json();
    if(d.error)throw new Error(d.error);
    stat(`영수증 ${d.total}장 인식`);
    renderReceiptList(d.receipts||[], d.total||0);
  }catch(e){stat('영수증 실패: '+e.message)}
}
function renderReceiptList(items,total){
  const c=document.getElementById('rcList');if(!c)return;
  c.innerHTML=`<div class="text-xs text-fg3 mb-6">인식된 영수증 ${total}장</div>`+
    items.map(r=>`<div class="text-xs" style="padding:3px 0;border-top:1px solid var(--bd)">🧾 ${esc(r.store_name||'(가게명 미인식 — 2단계에서 입력)')} ${r.amount!=null?esc((r.currency||'')+r.amount):''}${r.date?' · '+esc(r.date):''}</div>`).join('');
}

async function loadPlan(){
  let r=await fetch(`${API}/api/plan`);let p=await r.json();
  if(!p.days){
    r=await fetch(`${API}/api/plan/draft`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{"overwrite":true}'});
    if(!r.ok){const pr=document.getElementById('planRoot');if(pr)pr.innerHTML='<div class="text-xs" style="color:var(--err)">계획 생성 실패 — 사진 분석을 먼저 하세요.</div>';return}
    p=await r.json();
  }
  planData=p;
  if(!photos||!photos.length){ try{const pr=await fetch(`${API}/api/photos`); photos=await pr.json();}catch(e){} }
  window._pidMap={}; (photos||[]).forEach(p2=>{ if(p2&&p2.pid) window._pidMap[p2.pid]=p2; });
  const b=document.getElementById('planBanner');if(b)b.style.display=p.free_mode?'block':'none';
  if(p.trip_title&&!tripTitle){tripTitle=p.trip_title;const tt=document.getElementById('tt');if(tt)tt.value=tripTitle}
  renderPlan(p)}

function renderPlan(p){const root=document.getElementById('planRoot');if(!root)return;
  if(!p.days||!p.days.length){root.innerHTML='<div class="text-xs text-fg3">계획이 비어 있습니다.</div>';return}
  const un=p.unmatched_receipts||[];
  const unHtml=un.length?`<div class="card" style="border-color:var(--warn)"><div class="card-label">🧾 미배정 영수증 ${un.length}</div><div class="text-xs text-fg3 mb-6">어느 장소 것인지 지정하세요</div>${un.map((r,i)=>`<div style="margin:6px 0;padding:6px 8px;background:var(--sf3);border-radius:6px"><div style="font-size:11px;color:#9c9;margin-bottom:4px">🧾 ${esc(r.store_name||'(가게명?)')} ${r.amount!=null?esc((r.currency||'')+r.amount):''}${r.date?' · '+esc(r.date):''}</div><select onchange="assignReceipt(${i},this.value)" style="font-size:11px;width:100%;max-width:260px"><option value="">장소 선택…</option>${stopOptions(null)}</select></div>`).join('')}</div>`:'';
  root.innerHTML=unHtml+p.days.map(d=>`<div class="card"><div class="card-label">Day ${esc(''+d.day_no)} (${esc(d.date)||'날짜 미상'})</div>${(d.stops||[]).map(s=>stopCard(s)).join('')}</div>`).join('')
    +((p.undated_photo_ids&&p.undated_photo_ids.length)?`<div class="text-xs text-fg3 mt-6">📅 날짜 미상 사진 ${p.undated_photo_ids.length}장</div>`:'')}

function stopThumbs(s){
  const ids=(s.photo_ids||[]); if(!ids.length)return '';
  return `<div style="display:flex;gap:4px;flex-wrap:wrap;margin:4px 0">`+ids.map(pid=>{
    const p=(window._pidMap||{})[pid];
    return (p&&p.thumbnail)
      ?`<img src="${p.thumbnail}" title="${esc((p.file_name||'')+(p.scene_description?' · '+p.scene_description:''))}" style="width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--bd)">`
      :`<div style="width:56px;height:56px;border-radius:6px;background:var(--sf3);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--fg3)">사진</div>`;
  }).join('')+`</div>`;
}
function stopHints(s){
  const hs=(s.photo_ids||[]).map(pid=>((window._pidMap||{})[pid]||{}).scene_description).filter(Boolean);
  return hs.length?`<div class="text-xs text-fg3" style="margin-bottom:4px">💬 ${esc(hs.join(' · '))}</div>`:'';
}

  ${stopThumbs(s)}${stopHints(s)}
  <textarea class="f-events" placeholder="여기서 뭘 했는지 (사진 참고)" style="width:100%;font-size:11px;min-height:34px">${esc((s.events||[]).join('\n'))}</textarea>
  <textarea class="f-feeling" placeholder="느낀점/분위기" style="width:100%;font-size:11px;min-height:28px">${esc(s.feeling)}</textarea>
  <input class="f-ai" value="${esc(s.ai_instruction)}" placeholder="AI 작성 지시(선택)" style="width:100%;font-size:11px;margin-bottom:4px">
  <div class="flex items-center gap-6" style="margin-bottom:4px"><span class="text-xs text-fg2">⭐ 별점</span><input class="f-rating" type="number" min="0" max="5" step="0.5" value="${s.rating==null?'':s.rating}" style="width:70px"></div>
  ${s.receipt?`<div style="margin-top:4px;font-size:11px;display:flex;align-items:center;gap:6px;flex-wrap:wrap"><span style="color:#9c9">🧾 ${esc(s.receipt.store_name||'(가게명?)')} ${s.receipt.amount!=null?esc((s.receipt.currency||'')+s.receipt.amount):''}</span><select onchange="reassignReceipt('${esc(s.stop_id)}',this.value)" style="font-size:11px;max-width:200px">${stopOptions(s.stop_id)}<option value="__none__">— 미배정 —</option></select></div>`:''}
  </div>`}

function receiptText(r){if(!r)return '';const a=(r.amount!=null)?` ${r.currency||''}${r.amount}`:'';return `${r.store_name||''}${a}`.trim()}

function findStop(p,sid){if(!p||!p.days)return null;for(const d of p.days)for(const s of (d.stops||[]))if(s.stop_id===sid)return s;return null}
function stopOptions(selId){let h='';(planData&&planData.days||[]).forEach(d=>{(d.stops||[]).forEach(s=>{h+=`<option value="${esc(s.stop_id)}" ${s.stop_id===selId?'selected':''}>D${esc(''+d.day_no)} ${esc(s.name||'(이름없음)')}</option>`;});});return h;}

function collectPlan(){if(!planData)return;
  if(typeof tripTitle==='string')planData.trip_title=tripTitle;
  document.querySelectorAll('.stop').forEach(el=>{const s=findStop(planData,el.dataset.stop);if(!s)return;
    s.name=el.querySelector('.f-name').value.trim();s.name_source=s.name?'user':'none';
    s.events=el.querySelector('.f-events').value.split('\n').map(x=>x.trim()).filter(Boolean);
    s.feeling=el.querySelector('.f-feeling').value.trim();
    s.ai_instruction=el.querySelector('.f-ai').value.trim();
    const rv=el.querySelector('.f-rating').value;s.rating=rv===''?null:parseFloat(rv)})}

async function savePlan(){collectPlan();await fetch(`${API}/api/plan`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(planData)})}

async function reloadPlan(){const r=await fetch(`${API}/api/plan`);planData=await r.json();renderPlan(planData)}
function assignReceipt(idx,stopId){if(!planData||!stopId)return;const un=planData.unmatched_receipts||[];const rc=un[idx];if(!rc)return;const to=findStop(planData,stopId);if(!to)return;if(to.receipt)un.push(to.receipt);to.receipt=rc;un.splice(idx,1);savePlan().then(reloadPlan);}
function reassignReceipt(fromId,toId){if(!planData||toId===fromId)return;const from=findStop(planData,fromId);if(!from||!from.receipt)return;const rc=from.receipt;from.receipt=null;planData.unmatched_receipts=planData.unmatched_receipts||[];if(toId==='__none__'){planData.unmatched_receipts.push(rc);}else{const to=findStop(planData,toId);if(to){if(to.receipt)planData.unmatched_receipts.push(to.receipt);to.receipt=rc;}}savePlan().then(reloadPlan);}


async function nextFromPlan(){await savePlan();try{await loadGrps()}catch(e){}go(3)}

function renderRefs(){const c=document.getElementById('refList');if(!c)return;
c.innerHTML=refUrls.length?refUrls.map((u,i)=>`<div class="flex items-center gap-6" style="margin-bottom:3px"><span class="text-xs text-fg2" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(u)}">🔗 ${esc(u)}</span><button class="ba-btn" onclick="refUrls.splice(${i},1);renderRefs()">×</button></div>`).join(''):'<div class="text-xs text-fg3">아직 없음</div>'}
function addRef(){const i=document.getElementById('refIn');const u=(i?.value||'').trim();if(!u||!u.startsWith('http')){alert('URL은 http로 시작');return}if(!refUrls.includes(u))refUrls.push(u);i.value='';renderRefs()}
async function doStyle(){if(!refUrls.length){alert('URL을 추가해주세요');return}stat('스타일 분석...',true);try{const r=await fetch(`${API}/api/style`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({urls:refUrls})});const d=await r.json();if(d.error)throw new Error(d.error);stat(`✅ ${refUrls.length}개 분석 완료`)}catch(e){stat(`❌ ${e.message}`)}}

async function loadGrps(){const m=document.getElementById('modeSel')?.value||selMode;selMode=m;
const r=await fetch(`${API}/api/groups?mode=${m}`);groups=await r.json();
const c=document.getElementById('grpList');if(!c)return;
c.innerHTML=`<div class="card-label">그룹 (${groups.length}개)</div>`+groups.map((g,i)=>`<div class="block-item ${i===curGroup?'selected':''}" onclick="curGroup=${i};loadGrps()"><div class="bt">그룹 ${i+1}</div><div class="bc">${g.label} — ${g.photo_count}장</div></div>`).join('')}
async function chMode(){await loadGrps()}

function renderPE(){const c=document.getElementById('peList');if(!c||!photos.length)return;
const pg=[];let prev=null;photos.forEach((p,i)=>{const l=p.location_name||'미확인';if(l!==prev){pg.push({name:l,items:[]});prev=l}pg[pg.length-1].items.push({idx:i,p})});
const RO=[{v:'transit',l:'🚌 대중교통'},{v:'walking',l:'🚶 도보'},{v:'driving',l:'🚗 자가용'},{v:'bicycling',l:'🚲 자전거'}];
let h='';pg.forEach((g,pi)=>{
if(pi>0){const fr=pg[pi-1].name,to=g.name,rk=fr+'→'+to,cm=routeModes[rk]||'transit';
h+=`<div style="background:var(--sf3);border-left:3px solid var(--pri);padding:6px 10px;margin:3px 0;border-radius:0 6px 6px 0"><div class="flex items-center gap-6"><span class="text-xs" style="color:#93c5fd;font-weight:600">🚶 ${esc(fr)} → ${esc(to)}</span><select onchange="routeModes[\`${esc(rk)}\`]=this.value" style="padding:2px 4px;font-size:10px;background:var(--bg);border:1px solid var(--bd);border-radius:4px;color:var(--fg)">${RO.map(o=>`<option value="${o.v}" ${o.v===cm?'selected':''}>${o.l}</option>`).join('')}</select></div></div>`}
h+=`<div class="card" style="padding:8px 10px;margin-bottom:2px"><div class="flex items-center gap-6 mb-6"><span style="color:var(--olive);font-size:10px;font-weight:600;letter-spacing:1px">PLACE ${pi+1}</span><span class="text-xs text-fg3">${g.items.length}장</span></div>
<input type="text" value="${esc(g.name)}" style="font-weight:600;font-size:13px;margin-bottom:4px" onchange="renamePG(${pi},this.value)">
<input type="text" value="${esc(placeMemos[g.name]||'')}" placeholder="📝 메모..." style="font-size:11px;margin-bottom:6px" onchange="placeMemos['${esc(g.name)}']=this.value">`;
g.items.forEach(({idx,p})=>{h+=`<div class="flex gap-6 items-center" style="padding:3px 0;border-top:1px solid var(--bd)"><div style="width:44px;height:44px;border-radius:5px;overflow:hidden;flex-shrink:0">${p.thumbnail?`<img src="${p.thumbnail}" style="width:100%;height:100%;object-fit:cover">`:'<div style="background:var(--sf3);width:100%;height:100%"></div>'}</div><div style="flex:1;min-width:0"><div class="text-xs text-fg3" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">📷 ${esc(p.file_name)} ${p.food_name?`<span style="color:var(--warn)">🍽️${esc(p.food_name)}</span>`:''}</div><input type="text" value="${esc(p.location_name||'미확인')}" onchange="updPhoto(${idx},this.value)" style="font-size:11px;padding:2px 5px;width:100%;margin-top:1px;background:var(--bg);border:1px solid var(--bd);border-radius:3px;color:var(--fg)">${p.scene_description?`<div class="text-xs text-fg3" style="margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(p.scene_description)}">💬 ${esc(p.scene_description.substring(0,45))}</div>`:''}</div></div>`});
h+='</div>'});c.innerHTML=h}

function renamePG(gi,nn){nn=nn.trim();if(!nn)return;let prev=null,idx=-1;const tgts=[];
photos.forEach((p,i)=>{const l=p.location_name||'미확인';if(l!==prev){idx++;prev=l}if(idx===gi)tgts.push(i)});
const old=tgts.length?photos[tgts[0]].location_name:'';if(old===nn)return;
tgts.forEach(i=>{photos[i].location_name=nn});
if(placeMemos[old]){placeMemos[nn]=placeMemos[old];delete placeMemos[old]}
fetch(`${API}/api/photos/rename`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({old_name:old,new_name:nn})}).catch(()=>{});
renderPE();loadGrps()}

function updPhoto(i,nn){nn=nn.trim();if(!nn||i<0||i>=photos.length)return;photos[i].location_name=nn;
fetch(`${API}/api/photos/update`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({index:i,location_name:nn})}).catch(()=>{});
renderPE();loadGrps()}

// ═══ STEP 3: AI 생성 ═══
function renderS3(){$et.textContent='🤖 AI 초안 생성';$badge.textContent='STEP 3';
const places=[...new Set(photos.map(p=>p.location_name).filter(Boolean))];
$eb.innerHTML=`
<div class="card"><div class="card-label">글 스타일</div><select id="structSel"><option>감성 후기형</option><option>정보 가이드형</option><option>감성+정보 혼합형</option></select></div>
<div class="card"><div class="card-label">장소별 메모</div>${places.map(pl=>`<div class="mb-6"><div class="text-xs text-fg2 mb-6">📍 ${esc(pl)}</div><input type="text" class="memo-in" data-place="${esc(pl)}" value="${esc(placeMemos[pl]||'')}" placeholder="메모..." onchange="placeMemos['${esc(pl)}']=this.value"></div>`).join('')}</div>
<div class="flex gap-6">
  <button class="btn btn-pri" style="flex:1" onclick="doGen()">✨ 선택 그룹 생성</button>
  <button class="btn btn-ok" style="flex:1" onclick="doGenAll()">🚀 전체 그룹 생성</button>
</div>
<div class="text-xs text-fg3 mt-6">현재 선택: 그룹 ${curGroup+1} / 전체 ${groups.length}개</div>`}

async function doGen(){show('AI 초안 생성 중...');
const memos={...placeMemos};document.querySelectorAll('.memo-in').forEach(e=>{if(e.value)memos[e.dataset.place]=e.value});
await fetch(`${API}/api/generate`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({group_index:curGroup,title:tripTitle,structure:document.getElementById('structSel')?.value||'감성 후기형',place_memos:memos,route_modes:routeModes})});
startPoll(async p=>{if(p.status==='done'){await loadDrafts(curGroup);go(4)}})}

async function doGenAll(){show('전체 그룹 생성 중...');
const memos={...placeMemos};document.querySelectorAll('.memo-in').forEach(e=>{if(e.value)memos[e.dataset.place]=e.value});
await fetch(`${API}/api/generate_all`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:tripTitle,structure:document.getElementById('structSel')?.value||'감성 후기형',place_memos:memos,route_modes:routeModes})});
startPoll(async p=>{if(p.status==='done'){await loadDrafts(0);go(4)}})}

async function loadDrafts(gi){curGroup=gi;const r=await fetch(`${API}/api/drafts/${gi}`);drafts=await r.json();
if(drafts.length){draftTitle=drafts[0].title;draftTags=drafts[0].tags;await loadBlocks(0)}}

async function loadBlocks(di){curDraft=di;const r=await fetch(`${API}/api/blocks/${curGroup}/${di}`);const d=await r.json();
blocks=d.blocks||[];draftTitle=d.title||draftTitle;draftTags=d.tags||draftTags;selBlock=-1;if(step===4){renderS4();updatePreview()}}

// ═══ STEP 4: 편집 ═══
function renderS4(){$et.textContent='✏️ 편집';$badge.textContent=`${blocks.length}블록`;
// 그룹 탭
let h=`<div class="group-tabs">`;
for(let i=0;i<groups.length;i++){
  const hasDraft=!!Object.keys(state?.group_states||{}).length||i<=curGroup;
  h+=`<button class="group-tab ${i===curGroup?'active':''} ${hasDraft?'has-draft':''}" onclick="switchGroup(${i})">${groups[i]?.label||'그룹'+(i+1)}</button>`}
h+=`</div>`;
// 초안 선택
if(drafts.length>1){h+=`<div class="flex gap-6 mb-8">`+drafts.map((d,i)=>`<button class="btn ${i===curDraft?'btn-pri':'btn-ghost'} btn-sm" onclick="loadBlocks(${i})">초안${i+1}</button>`).join('')+`</div>`}
h+=`<div class="card"><div class="card-label">제목</div><input type="text" id="bTitle" value="${esc(draftTitle)}" oninput="draftTitle=this.value;updatePreview()"></div>`;
h+=`<div class="flex gap-6 mb-8"><button class="btn btn-ghost btn-sm" onclick="addBlk('text')">+ 텍스트</button><button class="btn btn-ghost btn-sm" onclick="addBlk('separator')">+ 구분선</button></div>`;
h+='<div id="bList">';
const icons={text:'📝',image:'🖼',separator:'─',styled_label:'🏷',heading:'📌',route:'🗺',map_link:'📍'};
blocks.forEach((b,i)=>{const s=i===selBlock;
let pv='';if(b.type==='text')pv=(b.content||'').substring(0,50);else if(b.type==='image')pv='(이미지)';else if(b.type==='separator')pv='─ ─ ─';else pv=b.content||'';
h+=`<div class="block-item ${s?'selected':''}" onclick="selBlk(${i})"><div class="bt">${icons[b.type]||'?'} ${b.type}</div><div class="bc">${esc(pv)}</div><div class="ba"><button class="ba-btn" onclick="event.stopPropagation();mvBlk(${i},-1)">↑</button><button class="ba-btn" onclick="event.stopPropagation();mvBlk(${i},1)">↓</button><button class="ba-btn" onclick="event.stopPropagation();delBlk(${i})">×</button></div></div>`});
h+='</div>';
if(selBlock>=0&&selBlock<blocks.length){const b=blocks[selBlock];
if(['text','styled_label','heading','route'].includes(b.type)){
h+=`<div class="card mt-8"><div class="card-label">블록 #${selBlock+1} 편집</div><textarea id="bEdit" style="min-height:60px" oninput="editBlk(this.value)">${esc(b.content||'')}</textarea></div>`}}
h+=`<button class="btn btn-ok w-full mt-12" onclick="go(5)">발행 준비 →</button>`;
$eb.innerHTML=h}

async function switchGroup(gi){if(gi===curGroup)return;
const r=await fetch(`${API}/api/drafts/${gi}`);const d=await r.json();
if(d.length){curGroup=gi;drafts=d;draftTitle=d[0].title;draftTags=d[0].tags;await loadBlocks(0);renderS4();updatePreview()}
else{alert(`그룹 ${gi+1}의 초안이 아직 없습니다. STEP 3에서 전체 생성을 해주세요.`)}}

function selBlk(i){selBlock=i;renderS4();const pb=document.getElementById('previewBody');if(pb){pb.scrollTop=(pb.scrollHeight*(i/Math.max(blocks.length,1)))-80}}
function editBlk(v){if(selBlock>=0&&selBlock<blocks.length){blocks[selBlock].content=v;updatePreview()}}
function mvBlk(i,d){const j=i+d;if(j<0||j>=blocks.length)return;[blocks[i],blocks[j]]=[blocks[j],blocks[i]];if(selBlock===i)selBlock=j;else if(selBlock===j)selBlock=i;renderS4();updatePreview()}
function delBlk(i){blocks.splice(i,1);if(selBlock>=blocks.length)selBlock=blocks.length-1;renderS4();updatePreview()}
function addBlk(t){const i=selBlock>=0?selBlock+1:blocks.length;blocks.splice(i,0,t==='text'?{type:'text',content:'(새 텍스트)'}:{type:'separator'});selBlock=i;renderS4();updatePreview()}

// ═══ STEP 5: 발행 ═══
function renderS5(){$et.textContent='🚀 발행';$badge.textContent='STEP 5';
const api=settings.api||{};
$eb.innerHTML=`
<div class="card"><div class="card-label">제목</div><input type="text" id="pTitle" value="${esc(draftTitle)}"></div>
<div class="card"><div class="card-label">태그</div><input type="text" id="pTags" value="${(draftTags||[]).join(', ')}" placeholder="쉼표 구분"></div>
<div class="card"><div class="card-label">발행 방식</div><select id="pMethod"><option value="selenium" ${api.publish_method==='selenium'?'selected':''}>자동 (Selenium)</option><option value="clipboard" ${api.publish_method==='clipboard'?'selected':''}>수동 (클립보드)</option></select></div>
<div class="card"><div class="card-label">공개 설정</div><select id="pVis"><option ${api.default_visibility==='비공개'?'selected':''}>비공개</option><option ${api.default_visibility==='공개'?'selected':''}>공개</option></select></div>
<div class="card"><div class="card-label">요약</div><div class="text-sm text-fg2">블록 ${blocks.length}개 · 이미지 ${blocks.filter(b=>b.type==='image').length}장</div></div>
<button class="btn btn-pri w-full mt-12" onclick="doPub()">📤 발행</button>
<button class="btn btn-ghost w-full mt-6" onclick="doSave()">💾 로컬 저장</button>`}

async function doPub(){const t=document.getElementById('pTitle')?.value||draftTitle;
const tags=(document.getElementById('pTags')?.value||'').split(',').map(s=>s.trim()).filter(Boolean);
const method=document.getElementById('pMethod')?.value||'selenium';
const vis=document.getElementById('pVis')?.value||'비공개';
show('발행 중...');await fetch(`${API}/api/publish`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:t,blocks,tags,method,visibility:vis})});
startPoll(p=>{if(p.status==='done')alert('✅ 발행 완료!');else if(p.status==='error')alert(p.message)})}

async function doSave(){const html=$pc.innerHTML;
const r=await fetch(`${API}/api/save`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:draftTitle,content:html,tags:draftTags})});
const d=await r.json();alert(d.saved_to?`저장: ${d.saved_to}`:'저장 실패')}

// ═══ 미리보기 ═══
async function updatePreview(){try{const r=await fetch(`${API}/api/preview`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({blocks,title:draftTitle})});
const d=await r.json();let h='';if(draftTitle)h+=`<h1 style="text-align:center;font-size:1.4em;color:#1f2937;font-weight:700;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid #e5e7eb">${esc(draftTitle)}</h1>`;
h+=d.html;$pc.innerHTML=h}catch(e){}}

// ── 초기화 ──
async function init(){
  try {
    const r=await fetch(`${API}/api/profiles`);const d=await r.json();
    const profiles=d.profiles||[];const last=d.last_used||'';

    if(profiles.length && last){
      // 마지막 사용 프로필 자동 로드
      const r2=await fetch(`${API}/api/profiles/${encodeURIComponent(last)}`);
      const s=await r2.json();
      if(!s.error){settings=s;profileName=last;refUrls=s.ref_urls||[];go(1);return}
    }
    if(profiles.length){
      go(-1);  // 프로필 선택 화면
    } else {
      go(0);   // 새 프로필 만들기
    }
  } catch(e){
    go(0);  // 서버 오류 시 설정 화면
  }
}
init();
</script>
