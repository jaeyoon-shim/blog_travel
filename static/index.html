<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TravelBlog Pro v10</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF8EF;--sf:#F3EFE1;--sf2:#F5F1E4;--sf3:#EDF2E1;--bd:#DBDAC3;--fg:#3B3F30;--fg2:#6E7458;--fg3:#9AA083;--pri:#7DB35A;--pri2:#6A9C47;--pri-glow:rgba(125,179,90,.16);--ok:#5AA24A;--warn:#C58A2C;--err:#D9534F;--olive:#8B9467;--radius:12px;--font:'Noto Sans KR',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--fg);height:100vh;overflow:hidden}
.app{display:grid;grid-template-rows:52px 1fr;grid-template-columns:1fr 1fr;height:100vh}
.header{grid-column:1/-1;background:var(--sf);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 20px;gap:12px}
.logo{font-size:15px;font-weight:700;background:linear-gradient(135deg,var(--pri),#a9d47f);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.steps{display:flex;gap:3px;margin-left:16px}
.step-btn{padding:5px 14px;border-radius:18px;font-size:11px;font-weight:500;border:1px solid var(--bd);background:transparent;color:var(--fg3);cursor:pointer;transition:all .2s}
.step-btn:hover{border-color:var(--fg3);color:var(--fg2)}
.step-btn.active{background:var(--pri);border-color:var(--pri);color:#fff}
.step-btn.done{border-color:var(--ok);color:var(--ok)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.status-pill{font-size:11px;padding:3px 10px;border-radius:10px;background:var(--sf2);color:var(--fg2);max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status-pill.busy{background:var(--pri-glow);color:var(--pri);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.editor{background:var(--sf);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden}
.editor-hdr{padding:12px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px}
.editor-title{font-size:13px;font-weight:600}
.editor-badge{font-size:10px;padding:2px 7px;border-radius:6px;background:var(--pri-glow);color:var(--pri)}
.editor-body{flex:1;overflow-y:auto;padding:12px 16px}
.editor-body::-webkit-scrollbar{width:5px}
.editor-body::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
.preview{background:#fff;display:flex;flex-direction:column;overflow:hidden}
.preview-hdr{padding:10px 16px;background:#f8f9fa;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:10px}
.preview-title{font-size:12px;font-weight:600;color:#374151}
.preview-badge{font-size:10px;padding:2px 7px;border-radius:6px;background:#ecfdf5;color:#059669}
.preview-body{flex:1;overflow-y:auto;padding:24px 32px}
.preview-body::-webkit-scrollbar{width:5px}
.preview-body::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:3px}
.preview-content{max-width:640px;margin:0 auto;font-family:var(--font);color:#333;line-height:1.8}
.preview-content img{max-width:100%;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.12)}
.card{background:var(--sf2);border:1px solid var(--bd);border-radius:var(--radius);padding:12px;margin-bottom:10px}
.card-label{font-size:10px;font-weight:600;color:var(--fg3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
input[type="text"],input[type="password"],textarea,select{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:7px;padding:8px 10px;color:var(--fg);font-family:var(--font);font-size:12px;outline:none;transition:border-color .2s}
input:focus,textarea:focus,select:focus{border-color:var(--pri)}
textarea{resize:vertical;min-height:50px;line-height:1.5}
.btn{padding:7px 14px;border-radius:7px;font-size:12px;font-weight:500;border:none;cursor:pointer;transition:all .15s;font-family:var(--font)}
.btn-pri{background:var(--pri);color:#fff}.btn-pri:hover{background:var(--pri2)}
.btn-ghost{background:transparent;border:1px solid var(--bd);color:var(--fg2)}.btn-ghost:hover{border-color:var(--fg3);color:var(--fg)}
.btn-sm{padding:4px 8px;font-size:10px}
.btn-ok{background:var(--ok);color:#fff}
.btn-warn{background:var(--warn);color:#000}
.btn-err{background:var(--err);color:#fff}
.block-item{background:var(--sf3);border:1px solid var(--bd);border-radius:7px;padding:8px 10px;margin-bottom:4px;cursor:pointer;transition:all .15s;position:relative}
.block-item:hover{border-color:var(--fg3)}
.block-item.selected{border-color:var(--pri);background:var(--pri-glow)}
.block-item .bt{font-size:9px;font-weight:600;color:var(--fg3);text-transform:uppercase;margin-bottom:2px}
.block-item .bc{font-size:11px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.block-item .ba{position:absolute;right:6px;top:50%;transform:translateY(-50%);display:none;gap:2px}
.block-item:hover .ba{display:flex}
.ba-btn{width:22px;height:22px;border-radius:4px;background:var(--bd);border:none;color:var(--fg2);cursor:pointer;font-size:10px;display:flex;align-items:center;justify-content:center}
.ba-btn:hover{background:var(--pri);color:#fff}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(55px,1fr));gap:3px}
.photo-thumb{aspect-ratio:1;border-radius:6px;overflow:hidden;border:1px solid var(--bd);cursor:pointer}
.photo-thumb img{width:100%;height:100%;object-fit:cover}
.dropzone{border:2px dashed var(--bd);border-radius:var(--radius);padding:32px;text-align:center;cursor:pointer;transition:all .2s}
.dropzone:hover{border-color:var(--pri);background:var(--pri-glow)}
.loading-overlay{position:fixed;inset:0;background:rgba(12,15,26,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px)}
.loading-spinner{width:36px;height:36px;border:3px solid var(--bd);border-top-color:var(--pri);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{margin-top:12px;font-size:13px;color:var(--fg2)}
.progress-bar{height:4px;background:var(--bd);border-radius:2px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;background:var(--pri);border-radius:2px;transition:width .3s}
.group-tabs{display:flex;gap:3px;margin-bottom:10px;flex-wrap:wrap}
.group-tab{padding:4px 12px;border-radius:6px;font-size:11px;border:1px solid var(--bd);background:transparent;color:var(--fg3);cursor:pointer}
.group-tab.active{background:var(--pri);border-color:var(--pri);color:#fff}
.group-tab.has-draft{border-color:var(--ok);color:var(--ok)}
.flex{display:flex}.gap-6{gap:6px}.gap-8{gap:8px}.items-center{align-items:center}.justify-between{justify-content:space-between}
.mt-6{margin-top:6px}.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}.mb-6{margin-bottom:6px}.mb-8{margin-bottom:8px}
.text-xs{font-size:10px}.text-sm{font-size:11px}.text-fg2{color:var(--fg2)}.text-fg3{color:var(--fg3)}
.w-full{width:100%}.hidden{display:none!important}
.color-input{width:36px;height:28px;border:1px solid var(--bd);border-radius:4px;background:var(--bg);cursor:pointer;padding:2px}
.settings-section{margin-bottom:16px}
.settings-section h3{font-size:12px;font-weight:600;color:var(--fg);margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--bd)}
.settings-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.settings-row label{font-size:11px;color:var(--fg2);flex-shrink:0;width:120px}
.settings-row .s-input{flex:1;min-width:0}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="header">
    <div class="logo">✈ TravelBlog Pro</div>
    <div class="steps" id="steps">
      <button class="step-btn active" data-step="1">1. 설정</button>
      <button class="step-btn" data-step="2">2. 업로드</button>
      <button class="step-btn" data-step="3">3. 계획검수</button>
      <button class="step-btn" data-step="4">4. AI생성</button>
      <button class="step-btn" data-step="5">5. 편집</button>
      <button class="step-btn" data-step="6">6. 발행</button>
    </div>
    <div class="hdr-right">
      <div class="status-pill" id="statusPill">준비</div>
    </div>
  </header>
  <div class="editor">
    <div class="editor-hdr"><span class="editor-title" id="editorTitle">⚙️ 설정</span><span class="editor-badge" id="editorBadge">STEP 1</span></div>
    <div class="editor-body" id="editorBody"></div>
  </div>
  <div class="preview">
    <div class="preview-hdr"><span class="preview-title">미리보기</span><span class="preview-badge">실시간</span></div>
    <div class="preview-body" id="previewBody">
      <div class="preview-content" id="previewContent">
        <div style="text-align:center;padding:60px 30px;color:#9ca3af">
          <p style="font-size:40px;margin-bottom:12px">✈</p>
          <p style="font-size:14px">사진을 업로드하면<br>블로그 미리보기가 표시됩니다</p>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="loading-overlay hidden" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-text" id="loadingText">처리 중...</div>
  <div class="progress-bar" style="width:200px;margin-top:10px"><div class="progress-fill" id="loadingProgress" style="width:0%"></div></div>
</div>

<script>
const API='';
// ── 상태 ──
let step=1, photos=[], groups=[], drafts=[], blocks=[], selBlock=-1;
let curGroup=0, curDraft=0, draftTitle='', draftTags=[];
let tripTitle='', selMode='by_place', placeMemos={}, routeModes={}, refUrls=[], planData=null, publishedGis=new Set();
let settings={}, pollTimer=null;

// ── DOM ──
const $eb=document.getElementById('editorBody'), $et=document.getElementById('editorTitle');
const $badge=document.getElementById('editorBadge'), $pc=document.getElementById('previewContent');
const $status=document.getElementById('statusPill');
const $loading=document.getElementById('loadingOverlay'), $lt=document.getElementById('loadingText'), $lp=document.getElementById('loadingProgress');

// ── 유틸 ──
function esc(s){return s?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}
function show(m){$loading.classList.remove('hidden');$lt.textContent=m;$lp.style.width='0%'}
function hide(){$loading.classList.add('hidden');stopPoll()}
function stat(t,b=false){$status.textContent=t;$status.classList.toggle('busy',b)}
function startPoll(cb){stopPoll();pollTimer=setInterval(async()=>{
  const r=await fetch(`${API}/api/status`);const d=await r.json();const p=d.progress;
  $lt.textContent=p.message;$lp.style.width=p.percent+'%';stat(p.message,p.status!=='done'&&p.status!=='error'&&p.status!=='idle');
  if(p.status==='done'||p.status==='error'){hide();if(cb)cb(p)}},800)}
function stopPoll(){if(pollTimer){clearInterval(pollTimer);pollTimer=null}}

// ── 네비 ──
document.querySelectorAll('.step-btn').forEach(b=>b.addEventListener('click',()=>go(+b.dataset.step)));
function go(n){step=n;document.querySelectorAll('.step-btn').forEach(b=>{b.classList.remove('active');if(+b.dataset.step===n)b.classList.add('active')});render();refreshStepDone()}
async function refreshStepDone(){
  try{const r=await fetch(`${API}/api/status`);const d=await r.json();
    const done={1:!!profileName,2:(d.photo_count||0)>0,3:!!d.has_plan,4:!!d.has_drafts,5:!!d.has_drafts};
    document.querySelectorAll('.step-btn').forEach(b=>{const n=+b.dataset.step;
      b.classList.toggle('done', !!done[n] && !b.classList.contains('active'));});
  }catch(e){}
}
function render(){({'-1':renderProfileSelect,1:renderSettings,2:renderS1,3:renderS2,4:renderS3,5:renderS4,6:renderS5})[String(step)]?.()}

let profileName='';  // 현재 프로필명

// ── 프로필 선택 화면 (STEP -1) ──
async function renderProfileSelect(){
  $et.textContent='👤 프로필 선택';$badge.textContent='START';
  $pc.innerHTML=`<div style="text-align:center;padding:60px 30px;color:#9ca3af">
    <p style="font-size:40px;margin-bottom:12px">✈</p>
    <p style="font-size:16px;font-weight:600;color:#374151">TravelBlog Pro</p>
    <p style="font-size:13px;margin-top:8px">프로필을 선택하거나 새로 만들어주세요</p>
  </div>`;

  const r=await fetch(`${API}/api/profiles`);const d=await r.json();
  const profiles=d.profiles||[];const last=d.last_used||'';

  let h=`<div style="text-align:center;margin-bottom:20px">
    <div style="font-size:32px;margin-bottom:8px">✈</div>
    <div style="font-size:16px;font-weight:700;color:var(--fg)">TravelBlog Pro</div>
    <div class="text-sm text-fg2 mt-6">프로필을 선택하여 시작하세요</div>
  </div>`;

  if(profiles.length){
    h+=`<div class="card-label">저장된 프로필</div>`;
    profiles.forEach(p=>{
      const isLast=p.name===last;
      h+=`<div class="block-item ${isLast?'selected':''}" onclick="selectProfile('${esc(p.name)}')" style="margin-bottom:6px">
        <div class="flex items-center justify-between">
          <div>
            <div style="font-size:13px;font-weight:600;color:var(--fg)">${esc(p.name)} ${isLast?'<span class="text-xs" style="color:var(--ok)">(최근)</span>':''}</div>
            <div class="text-xs text-fg2 mt-6">${esc(p.tone)} · ${esc(p.mood)} · 참고URL ${p.ref_count}개</div>
            <div class="text-xs text-fg3">${esc(p.modified)}</div>
          </div>
          <div style="width:24px;height:24px;border-radius:50%;background:${p.accent_color||'#8B9467'}"></div>
        </div>
      </div>`});
  } else {
    h+=`<div class="card" style="text-align:center;padding:24px"><div class="text-sm text-fg2">저장된 프로필이 없습니다<br>새 프로필을 만들어주세요</div></div>`;
  }

  h+=`<button class="btn btn-pri w-full mt-16" onclick="newProfile()">+ 새 프로필 만들기</button>`;
  if(profiles.length){
    h+=`<div class="text-xs text-fg3 mt-8" style="text-align:center">프로필 클릭으로 바로 시작</div>`;
  }
  $eb.innerHTML=h;
}

async function selectProfile(name){
  stat('프로필 로드 중...',true);
  try{
    const r=await fetch(`${API}/api/profiles/${encodeURIComponent(name)}`);
    if(!r.ok){stat('로드 실패');alert(`프로필 로드 실패 (${r.status}).\n앱을 재시작했는지 확인하세요:\npython app.py`);return}
    const d=await r.json();
    if(d.error){stat('로드 실패');alert(d.error);return}
    settings=d;profileName=name;refUrls=d.ref_urls||[];
    stat(`✅ "${name}" 프로필 로드됨`);
    go(1);   // 설정 화면으로 → 불러온 저장사항을 바로 확인
  }catch(e){stat('로드 실패');alert('프로필 로드 오류: '+e.message+'\n앱 재시작(python app.py)이 필요할 수 있습니다.');}
}

function newProfile(){
  profileName='';settings=JSON.parse(JSON.stringify(DEFAULT_SETTINGS));refUrls=[];
  go(1);
}

const DEFAULT_SETTINGS={
  blog_style:{tone:"친근 구어체",mood:"감성적",emoji_level:"적당히",photo_desc_length:"2~3줄",place_intro_length:"3~4줄",include_tips:true,include_outro:true},
  design:{accent_color:"#8B9467",separator_style:"─ ─ ─",place_label:"PLACE N",intro_style:"✈ 여행기 ✈"},
  ref_urls:[],api:{openai_key:"",openai_model:"gpt-4o-mini",google_key:"",naver_id:"",naver_pw:"",publish_method:"selenium",default_visibility:"비공개"},
  custom_prompt:{extra_instructions:"",banned_expressions:"",required_keywords:""}
};

// ── 설정 로드 ──
async function loadSettings(){
  try {
    const r=await fetch(`${API}/api/settings/raw`);
    settings=await r.json();
    refUrls=settings.ref_urls||[];
  } catch(e) {
    settings={};refUrls=[];
  }
}
loadSettings();

// ═══ STEP 1: 설정 ═══
function renderSettings(){
  $et.textContent='⚙️ 설정';$badge.textContent='STEP 1';
  const s=settings;const bs=s.blog_style||{};const ds=s.design||{};const api=s.api||{};const cp=s.custom_prompt||{};

  // 우측: 설정 예시 미리보기
  updateSettingsPreview(bs, ds, cp);

  $eb.innerHTML=`
  <div class="card"><div class="card-label">프로필 이름</div><input type="text" id="s_name" value="${esc(profileName)}" placeholder="예: 내 여행블로그, 감성 스타일..."></div>
  <div class="settings-section"><h3>✍️ 블로그 스타일</h3>
    <div class="settings-row"><label>말투</label><div class="s-input"><select id="s_tone" onchange="updateSettingsPreviewLive()"><option ${bs.tone==='친근 구어체'?'selected':''}>친근 구어체</option><option ${bs.tone==='정중 존댓말'?'selected':''}>정중 존댓말</option><option ${bs.tone==='캐주얼 반말'?'selected':''}>캐주얼 반말</option></select></div></div>
    <div class="settings-row"><label>글 톤</label><div class="s-input"><select id="s_mood" onchange="updateSettingsPreviewLive()"><option ${bs.mood==='감성적'?'selected':''}>감성적</option><option ${bs.mood==='정보 위주'?'selected':''}>정보 위주</option><option ${bs.mood==='유머러스'?'selected':''}>유머러스</option></select></div></div>
    <div class="settings-row"><label>이모지 사용</label><div class="s-input"><select id="s_emoji" onchange="updateSettingsPreviewLive()"><option ${bs.emoji_level==='많이'?'selected':''}>많이</option><option ${bs.emoji_level==='적당히'?'selected':''}>적당히</option><option ${bs.emoji_level==='안 씀'?'selected':''}>안 씀</option></select></div></div>
    <div class="settings-row"><label>사진 설명 길이</label><div class="s-input"><select id="s_pdl"><option ${bs.photo_desc_length==='1~2줄'?'selected':''}>1~2줄</option><option ${bs.photo_desc_length==='2~3줄'?'selected':''}>2~3줄</option><option ${bs.photo_desc_length==='3~4줄'?'selected':''}>3~4줄</option></select></div></div>
    <div class="settings-row"><label>장소 소개 길이</label><div class="s-input"><select id="s_pil"><option ${bs.place_intro_length==='2~3줄'?'selected':''}>2~3줄</option><option ${bs.place_intro_length==='3~4줄'?'selected':''}>3~4줄</option><option ${bs.place_intro_length==='5줄+'?'selected':''}>5줄+</option></select></div></div>
    <div class="settings-row"><label>꿀팁 포함</label><div class="s-input"><select id="s_tips"><option value="true" ${bs.include_tips!==false?'selected':''}>포함</option><option value="false" ${bs.include_tips===false?'selected':''}>미포함</option></select></div></div>
    <div class="settings-row"><label>마무리 인사</label><div class="s-input"><select id="s_outro"><option value="true" ${bs.include_outro!==false?'selected':''}>포함</option><option value="false" ${bs.include_outro===false?'selected':''}>미포함</option></select></div></div>
  </div>
  <div class="settings-section"><h3>🎨 디자인</h3>
    <div class="settings-row"><label>포인트 색상</label><div class="s-input"><input type="color" id="s_color" value="${ds.accent_color||'#8B9467'}" class="color-input" onchange="updateSettingsPreviewLive()"></div></div>
    <div class="settings-row"><label>구분선 스타일</label><div class="s-input"><select id="s_sep" onchange="updateSettingsPreviewLive()"><option ${ds.separator_style==='─ ─ ─'?'selected':''}>─ ─ ─</option><option ${ds.separator_style==='━━━'?'selected':''}>━━━</option><option ${ds.separator_style==='· · ·'?'selected':''}>· · ·</option><option ${ds.separator_style==='없음'?'selected':''}>없음</option></select></div></div>
    <div class="settings-row"><label>장소 라벨</label><div class="s-input"><select id="s_label" onchange="updateSettingsPreviewLive()"><option ${ds.place_label==='PLACE N'?'selected':''}>PLACE N</option><option ${ds.place_label==='장소 N'?'selected':''}>장소 N</option><option ${ds.place_label==='없음'?'selected':''}>없음</option></select></div></div>

async function restoreUploadState(){
  try{const r=await fetch(`${API}/api/status`);const d=await r.json();
    const uc=d.upload_count||0, ac=d.photo_count||0;
    const c=document.getElementById('upPhotos'), b=document.getElementById('anaBtn');
    if(ac>0){  // 이미 분석 완료
      if(c)c.innerHTML=`<div class="card" style="border-color:var(--ok)"><div style="color:var(--ok);font-size:13px">✅ ${ac}장 분석 완료</div><div class="text-xs text-fg3 mt-6">계획 검수(3단계)로 이동하거나 사진을 추가 업로드할 수 있습니다.</div></div>`;
      if(b){b.classList.remove('hidden');b.textContent='🔍 다시 분석';}
    } else if(uc>0){  // 업로드만 됨
      if(c)c.innerHTML=`<div class="text-xs text-fg2">${uc}장 업로드됨 — 아래 버튼으로 분석을 시작하세요.</div>`;
      if(b)b.classList.remove('hidden');
    }
  }catch(e){}
}

async function uploadFiles(files){
  const imgs=Array.from(files).filter(f=>f.type.startsWith('image/')||/\.(jpg|jpeg|png|gif|webp|heic)$/i.test(f.name));
  if(!imgs.length){alert('이미지 파일을 선택해주세요');return}
  stat(`${imgs.length}장 업로드 중...`,true);
  const c=document.getElementById('upPhotos');
  c.innerHTML=`<div class="text-xs text-fg3">${imgs.length}장 업로드 중...</div><div class="photo-grid" id="tg"></div>`;
  const tg=document.getElementById('tg');
  imgs.forEach(f=>{tg.innerHTML+=`<div class="photo-thumb"><img src="${URL.createObjectURL(f)}"></div>`});
  const fd=new FormData();imgs.forEach(f=>fd.append('photos',f));
  try{const r=await fetch(`${API}/api/upload`,{method:'POST',body:fd});const d=await r.json();
    stat(`✅ ${d.uploaded}장 업로드`);c.querySelector('.text-xs').textContent=`${d.uploaded}장 업로드 완료`;
    document.getElementById('anaBtn').classList.remove('hidden');
  }catch(e){stat('❌ 업로드 실패');c.innerHTML=`<div class="card" style="border-color:var(--err)"><div style="color:var(--err);font-size:12px">❌ ${esc(e.message)}<br><span class="text-xs text-fg3">python app.py 실행 확인</span></div></div>`}}

async function uploadReceipts(files){
  const imgs=Array.from(files).filter(f=>f.type.startsWith('image/'));
  if(!imgs.length){alert('이미지 파일을 선택해주세요');return}
  stat(`영수증 ${imgs.length}장 인식 중...`,true);
  const fd=new FormData();imgs.forEach(f=>fd.append('receipts',f));
  try{
    const r=await fetch(`${API}/api/receipts/upload`,{method:'POST',body:fd});
    const d=await r.json();
    if(d.error)throw new Error(d.error);
    stat(`영수증 ${d.total}장 인식`);
    renderReceiptList(d.receipts||[], d.total||0);
  }catch(e){stat('영수증 실패: '+e.message)}
}
function renderReceiptList(items,total){
  const c=document.getElementById('rcList');if(!c)return;
  c.innerHTML=`<div class="text-xs text-fg3 mb-6">인식된 영수증 ${total}장</div>`+
    items.map(r=>`<div class="text-xs" style="padding:3px 0;border-top:1px solid var(--bd)">🧾 ${esc(r.store_name||'(가게명 미인식 — 3단계에서 입력)')} ${r.amount!=null?esc((r.currency||'')+r.amount):''}${r.date?' · '+esc(r.date):''}</div>`).join('');
}

async function doAnalyze(){show('사진 분석 중...');await fetch(`${API}/api/analyze`,{method:'POST'});
  startPoll(async p=>{
    if(p.status==='error'){alert('❌ 사진 분석 실패\n\n'+(p.message||'알 수 없는 오류'));return}
    if(p.status==='done'){const r=await fetch(`${API}/api/photos`);photos=await r.json();
      if(!photos.length){alert('분석된 사진이 없습니다. 사진을 먼저 업로드했는지 확인하세요.');return}
      window._needNewDraft=true;   // 새 분석 = 새 계획 필요 (이전 여행 plan 재사용 금지)
      go(3)}
  })}

function stopThumbs(s){

  const st='width:112px;height:112px;object-fit:cover;border-radius:10px;border:1px solid var(--bd);cursor:zoom-in';

    const p=(window._pidMap||{})[pid];
    const img=(p&&p.thumbnail)
      ?`<img src="${p.thumbnail}" title="${esc((p.file_name||'')+(p.scene_description?' · '+p.scene_description:''))}" style="${st}" onclick="window.open('/uploads/'+encodeURIComponent('${esc(p&&p.file_name||'')}'),'_blank')">`
      :`<div style="width:112px;height:112px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--fg3)">사진</div>`;
    const split=multi?`<button title="이 사진을 새 장소로 분리" onclick="splitPhoto('${esc(pid)}','${esc(s.stop_id)}')" style="position:absolute;top:3px;right:3px;width:22px;height:22px;border:none;border-radius:6px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;cursor:pointer;line-height:1;padding:0">✂</button>`:'';
    return `<div style="position:relative;display:inline-block">${img}${split}</div>`;
  }).join('')+`</div>`;
}
function stopHints(s){
  const hs=(s.photo_ids||[]).map(pid=>((window._pidMap||{})[pid]||{}).scene_description).filter(Boolean);
  return hs.length?`<div style="font-size:12px;color:var(--fg2);margin:2px 0 10px;line-height:1.5">💬 ${esc(hs.join(' · '))}</div>`:'';

function stopGps(s){

function stopMap(s){

function loadStopMap(mid,lat,lon){

}
function stopCard(s){const rc=s.receipt||null;
  const lbl='font-size:11px;color:var(--fg3);margin:10px 0 3px;font-weight:500';
  const ta='width:100%;font-size:13px;padding:9px 11px;min-height:46px;line-height:1.6;box-sizing:border-box';
  return `<div class="stop" data-stop="${esc(s.stop_id)}" style="background:var(--sf3);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:12px 0">
  <input class="f-name" value="${esc(s.name)}" placeholder="📍 장소 이름 (사진 보고 입력)" style="font-weight:700;font-size:15px;width:100%;padding:9px 11px;box-sizing:border-box">
  ${stopThumbs(s)}${stopHints(s)}${stopMap(s)}
  <div style="${lbl}">📝 무슨 일이 있었나</div>
  <textarea class="f-events" placeholder="예: 운하 산책, 유리공예 거리 구경…" style="${ta}">${esc((s.events||[]).join('\n'))}</textarea>
  <div style="${lbl}">💭 느낀 점 · 분위기</div>
  <textarea class="f-feeling" placeholder="예: 해질녘 가스등이 켜지는데 로맨틱했음" style="${ta};min-height:40px">${esc(s.feeling)}</textarea>
  <div style="${lbl}">✍️ AI에게 줄 지시 (선택)</div>

  ${s.receipt?`<div style="margin-top:10px;font-size:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span style="color:var(--ok)">🧾 ${esc(s.receipt.store_name||'(가게명?)')} ${s.receipt.amount!=null?esc((s.receipt.currency||'')+s.receipt.amount):''}</span><select onchange="reassignReceipt('${esc(s.stop_id)}',this.value)" style="font-size:12px;max-width:200px">${stopOptions(s.stop_id)}<option value="__none__">— 미배정 —</option></select></div>`:''}
  <div style="margin-top:8px"><select onchange="if(this.value)mergeStop('${esc(s.stop_id)}',this.value)" style="font-size:11px;max-width:230px"><option value="">🔗 다른 장소와 합치기…</option>${stopOptionsExcept(s.stop_id)}</select></div>

function receiptText(r){if(!r)return '';const a=(r.amount!=null)?` ${r.currency||''}${r.amount}`:'';return `${r.store_name||''}${a}`.trim()}

function findStop(p,sid){if(!p||!p.days)return null;for(const d of p.days)for(const s of (d.stops||[]))if(s.stop_id===sid)return s;return null}
function stopOptions(selId){let h='';(planData&&planData.days||[]).forEach(d=>{(d.stops||[]).forEach(s=>{h+=`<option value="${esc(s.stop_id)}" ${s.stop_id===selId?'selected':''}>D${esc(''+d.day_no)} ${esc(s.name||'(이름없음)')}</option>`;});});return h;}
function stopOptionsExcept(sid){
  let h='';
  ((planData&&planData.days)||[]).forEach(d=>{(d.stops||[]).forEach(s=>{
    if(s.stop_id!==sid) h+=`<option value="${esc(s.stop_id)}">D${esc(''+d.day_no)} ${esc(s.name||'(이름없음)')}</option>`;
  });});
  return h;
}
function mergeStop(fromId,toId){
  if(!planData||!toId||toId===fromId)return;
  const from=findStop(planData,fromId), to=findStop(planData,toId);
  if(!from||!to)return;
  to.photo_ids=(to.photo_ids||[]).concat(from.photo_ids||[]);
  if(!to.receipt && from.receipt) to.receipt=from.receipt;
  for(const d of planData.days){const i=d.stops.findIndex(x=>x.stop_id===fromId); if(i>=0){d.stops.splice(i,1);break;}}
  savePlan().then(reloadPlan);
}
function splitPhoto(pid,fromId){
  if(!planData)return;
  for(const d of planData.days){
    const s=d.stops.find(x=>x.stop_id===fromId);
    if(!s)continue;
    if((s.photo_ids||[]).length<=1)return;   // 나눌 게 없음
    const pi=s.photo_ids.indexOf(pid); if(pi<0)return;
    s.photo_ids.splice(pi,1);
    const nid='s'+Date.now()+Math.floor(Math.random()*1000);
    const si=d.stops.indexOf(s);
    d.stops.splice(si+1,0,{stop_id:nid,order:0,name:'',name_source:'none',events:[],feeling:'',ai_instruction:'',rating:null,receipt:null,show_rating:true,show_price:true,photo_ids:[pid]});
    break;
  }
  savePlan().then(reloadPlan);
}

function collectPlan(){if(!planData)return;
  if(typeof tripTitle==='string')planData.trip_title=tripTitle;
  document.querySelectorAll('.stop').forEach(el=>{const s=findStop(planData,el.dataset.stop);if(!s)return;
    s.name=el.querySelector('.f-name').value.trim();s.name_source=s.name?'user':'none';
    s.events=el.querySelector('.f-events').value.split('\n').map(x=>x.trim()).filter(Boolean);
    s.feeling=el.querySelector('.f-feeling').value.trim();
    s.ai_instruction=el.querySelector('.f-ai').value.trim();
    const rv=el.querySelector('.f-rating').value;s.rating=rv===''?null:parseFloat(rv)})}

async function reloadPlan(){const r=await fetch(`${API}/api/plan`);planData=await r.json();renderPlan(planData)}
function assignReceipt(idx,stopId){if(!planData||!stopId)return;const un=planData.unmatched_receipts||[];const rc=un[idx];if(!rc)return;const to=findStop(planData,stopId);if(!to)return;if(to.receipt)un.push(to.receipt);to.receipt=rc;un.splice(idx,1);savePlan().then(reloadPlan);}
function reassignReceipt(fromId,toId){if(!planData||toId===fromId)return;const from=findStop(planData,fromId);if(!from||!from.receipt)return;const rc=from.receipt;from.receipt=null;planData.unmatched_receipts=planData.unmatched_receipts||[];if(toId==='__none__'){planData.unmatched_receipts.push(rc);}else{const to=findStop(planData,toId);if(to){if(to.receipt)planData.unmatched_receipts.push(to.receipt);to.receipt=rc;}}savePlan().then(reloadPlan);}

function selBlk(i){selBlock=i;renderS4();const pb=document.getElementById('previewBody');if(pb){pb.scrollTop=(pb.scrollHeight*(i/Math.max(blocks.length,1)))-80}}

function mvBlk(i,d){const j=i+d;if(j<0||j>=blocks.length)return;[blocks[i],blocks[j]]=[blocks[j],blocks[i]];if(selBlock===i)selBlock=j;else if(selBlock===j)selBlock=i;renderS4();updatePreview()}
function delBlk(i){blocks.splice(i,1);if(selBlock>=blocks.length)selBlock=blocks.length-1;renderS4();updatePreview()}

async function doPub(){const t=document.getElementById('pTitle')?.value||draftTitle;

const method=document.getElementById('pMethod')?.value||'selenium';

startPoll(p=>{if(p.status==='done'){publishedGis.add(curGroup);
const next=groups.findIndex((g,i)=>!publishedGis.has(i));
if(next>=0&&confirm(`✅ 발행 완료!\n\n다음 일차(${groups[next]?.label||(next+1)+'일차'})를 이어서 발행할까요?`)){pubSwitch(next)}

else if(p.status==='error')alert('❌ 발행 실패\n\n'+(p.message||'알 수 없는 오류'))})}

async function doPubAll(){
  const method=document.getElementById('pMethod')?.value||'selenium';
  const vis=document.getElementById('pVis')?.value||'비공개';
  const n=(groups&&groups.length)||0;
  if(!n){alert('발행할 일정이 없습니다.');return}
  if(!confirm(`전체 ${n}일 일정을 각각 별도 글로 발행합니다.\n공개설정: ${vis}\n계속할까요? (발행은 되돌리기 어렵습니다)`))return;
  const gs=[]; const failed=[];
  for(let gi=0; gi<n; gi++){
    try{
      const r=await fetch(`${API}/api/blocks/${gi}/0`);
      const d=await r.json();
      if(d.blocks && d.blocks.length) gs.push({title:d.title||('Day '+(gi+1)), blocks:d.blocks, tags:d.tags||[]});
      else failed.push(gi+1);
    }catch(e){failed.push(gi+1)}
  }
  if(!gs.length){alert('생성된 초안이 없습니다. STEP 4에서 "전체 일정 생성"을 먼저 하세요.');return}
  if(failed.length && !confirm(`Day ${failed.join(', ')}의 초안을 불러오지 못해 제외됩니다.\n나머지 ${gs.length}일만 발행할까요?`))return;
  show(`전체 ${gs.length}일 발행 중...`);
  await fetch(`${API}/api/publish_all`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({groups:gs,visibility:vis,method})});
  startPoll(p=>{ if(p.status==='done')alert('✅ 전체 발행 완료!'); else if(p.status==='error')alert('❌ 전체 발행 실패\n\n'+(p.message||'알 수 없는 오류')); });
}

    const profiles=d.profiles||[];const last=d.last_used||'';

    if(profiles.length && last){
      // 마지막 사용 프로필 자동 로드 → 이미 설정돼 있으니 바로 업로드로
      const r2=await fetch(`${API}/api/profiles/${encodeURIComponent(last)}`);
      const s=await r2.json();
      if(!s.error){settings=s;profileName=last;refUrls=s.ref_urls||[];go(2);return}
    }
    if(profiles.length){
      go(-1);  // 프로필 선택 화면
    } else {
      go(1);   // 새 프로필 만들기 → 설정 화면
    }
  } catch(e){
    go(1);  // 서버 오류 시 설정 화면
  }
}
init();
</script>
</body>
</html>
