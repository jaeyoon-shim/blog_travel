<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TravelBlog Pro v9 — Web Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c0f1a;
  --sf: #151929;
  --sf2: #1d2340;
  --sf3: #252d4a;
  --bd: #2a3459;
  --fg: #e8ecf4;
  --fg2: #8b95b0;
  --fg3: #5a6380;
  --pri: #6366f1;
  --pri2: #4f46e5;
  --pri-glow: rgba(99,102,241,.15);
  --ok: #10b981;
  --warn: #f59e0b;
  --err: #ef4444;
  --olive: #8B9467;
  --radius: 12px;
  --font: 'Noto Sans KR', sans-serif;
  --mono: 'JetBrains Mono', monospace;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--fg);
  height: 100vh;
  overflow: hidden;
}

/* ── 레이아웃 ── */
.app {
  display: grid;
  grid-template-rows: 56px 1fr;
  grid-template-columns: 1fr 1fr;
  height: 100vh;
}

/* ── 헤더 ── */
.header {
  grid-column: 1 / -1;
  background: var(--sf);
  border-bottom: 1px solid var(--bd);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 20px;
}
.logo {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.5px;
  background: linear-gradient(135deg, var(--pri), #a78bfa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.steps {
  display: flex;
  gap: 4px;
  margin-left: 24px;
}
.step-btn {
  padding: 6px 16px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
  border: 1px solid var(--bd);
  background: transparent;
  color: var(--fg3);
  cursor: pointer;
  transition: all .2s;
}
.step-btn:hover { border-color: var(--fg3); color: var(--fg2); }
.step-btn.active { background: var(--pri); border-color: var(--pri); color: #fff; }
.step-btn.done { border-color: var(--ok); color: var(--ok); }

.status-pill {
  margin-left: auto;
  font-size: 12px;
  padding: 4px 12px;
  border-radius: 12px;
  background: var(--sf2);
  color: var(--fg2);
}
.status-pill.busy { background: var(--pri-glow); color: var(--pri); animation: pulse 1.5s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }

/* ── 좌측 편집 패널 ── */
.editor {
  background: var(--sf);
  border-right: 1px solid var(--bd);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.editor-header {
  padding: 16px 20px 12px;
  border-bottom: 1px solid var(--bd);
  display: flex;
  align-items: center;
  gap: 12px;
}
.editor-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--fg);
}
.editor-badge {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 8px;
  background: var(--pri-glow);
  color: var(--pri);
}
.editor-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px;
}
.editor-body::-webkit-scrollbar { width: 6px; }
.editor-body::-webkit-scrollbar-thumb { background: var(--bd); border-radius: 3px; }

/* ── 우측 미리보기 패널 ── */
.preview {
  background: #fff;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.preview-header {
  padding: 12px 20px;
  background: #f8f9fa;
  border-bottom: 1px solid #e5e7eb;
  display: flex;
  align-items: center;
  gap: 12px;
}
.preview-title {
  font-size: 13px;
  font-weight: 600;
  color: #374151;
}
.preview-badge {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 8px;
  background: #ecfdf5;
  color: #059669;
}
.preview-body {
  flex: 1;
  overflow-y: auto;
  padding: 32px 40px;
}
.preview-body::-webkit-scrollbar { width: 6px; }
.preview-body::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }

/* ── 컴포넌트: 카드 ── */
.card {
  background: var(--sf2);
  border: 1px solid var(--bd);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
}
.card-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--fg3);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
}

/* ── 컴포넌트: 입력 ── */
input[type="text"], textarea, select {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--bd);
  border-radius: 8px;
  padding: 10px 12px;
  color: var(--fg);
  font-family: var(--font);
  font-size: 13px;
  outline: none;
  transition: border-color .2s;
}
input:focus, textarea:focus, select:focus {
  border-color: var(--pri);
}
textarea { resize: vertical; min-height: 60px; line-height: 1.6; }

/* ── 컴포넌트: 버튼 ── */
.btn {
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  border: none;
  cursor: pointer;
  transition: all .15s;
  font-family: var(--font);
}
.btn-pri {
  background: var(--pri);
  color: #fff;
}
.btn-pri:hover { background: var(--pri2); transform: translateY(-1px); }
.btn-ghost {
  background: transparent;
  border: 1px solid var(--bd);
  color: var(--fg2);
}
.btn-ghost:hover { border-color: var(--fg3); color: var(--fg); }
.btn-sm { padding: 5px 10px; font-size: 11px; }
.btn-ok { background: var(--ok); color: #fff; }
.btn-warn { background: var(--warn); color: #000; }
.btn-err { background: var(--err); color: #fff; }

.btn-group { display: flex; gap: 6px; flex-wrap: wrap; }

/* ── 컴포넌트: 블록 아이템 ── */
.block-item {
  background: var(--sf3);
  border: 1px solid var(--bd);
  border-radius: 8px;
  padding: 10px 12px;
  margin-bottom: 6px;
  cursor: pointer;
  transition: all .15s;
  position: relative;
}
.block-item:hover { border-color: var(--fg3); }
.block-item.selected { border-color: var(--pri); background: var(--pri-glow); }
.block-item .block-type {
  font-size: 10px;
  font-weight: 600;
  color: var(--fg3);
  text-transform: uppercase;
  margin-bottom: 4px;
}
.block-item .block-content {
  font-size: 12px;
  color: var(--fg2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.block-item .block-actions {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  display: none;
  gap: 2px;
}
.block-item:hover .block-actions { display: flex; }
.block-act {
  width: 24px;
  height: 24px;
  border-radius: 4px;
  background: var(--bd);
  border: none;
  color: var(--fg2);
  cursor: pointer;
  font-size: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.block-act:hover { background: var(--pri); color: #fff; }

/* ── 사진 그리드 ── */
.photo-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
  gap: 8px;
}
.photo-thumb {
  aspect-ratio: 1;
  border-radius: 8px;
  overflow: hidden;
  border: 2px solid transparent;
  cursor: pointer;
  transition: all .2s;
  position: relative;
}
.photo-thumb img { width: 100%; height: 100%; object-fit: cover; }
.photo-thumb:hover { border-color: var(--pri); }
.photo-thumb.selected { border-color: var(--ok); }
.photo-thumb .photo-name {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 2px 4px;
  background: rgba(0,0,0,.6);
  font-size: 9px;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── 미리보기 콘텐츠 스타일 ── */
.preview-content {
  max-width: 680px;
  margin: 0 auto;
  font-family: 'Noto Sans KR', sans-serif;
  color: #333;
  line-height: 1.8;
}
.preview-content img {
  max-width: 100%;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0,0,0,.12);
}
.preview-content h2 {
  text-align: center;
  font-size: 1.3em;
  color: #3d3d3d;
  font-weight: 600;
  margin: 8px 0;
}
.preview-content p {
  text-align: center;
  margin: 4px 0;
}
.preview-content figure {
  text-align: center;
  margin: 20px 0;
}

/* ── 로딩 오버레이 ── */
.loading-overlay {
  position: fixed;
  inset: 0;
  background: rgba(12,15,26,.85);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 100;
  backdrop-filter: blur(4px);
}
.loading-spinner {
  width: 40px;
  height: 40px;
  border: 3px solid var(--bd);
  border-top-color: var(--pri);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text {
  margin-top: 16px;
  font-size: 14px;
  color: var(--fg2);
}

/* ── 드롭존 ── */
.dropzone {
  border: 2px dashed var(--bd);
  border-radius: var(--radius);
  padding: 40px;
  text-align: center;
  cursor: pointer;
  transition: all .2s;
}
.dropzone:hover { border-color: var(--pri); background: var(--pri-glow); }
.dropzone-icon { font-size: 36px; margin-bottom: 12px; }
.dropzone-text { font-size: 13px; color: var(--fg2); }

/* ── 편집 영역 textarea ── */
.edit-area {
  width: 100%;
  min-height: 80px;
  background: var(--bg);
  border: 1px solid var(--bd);
  border-radius: 8px;
  padding: 10px;
  color: var(--fg);
  font-size: 13px;
  line-height: 1.6;
  font-family: var(--font);
  resize: vertical;
  outline: none;
}
.edit-area:focus { border-color: var(--pri); }

/* ── 진행 바 ── */
.progress-bar {
  height: 4px;
  background: var(--bd);
  border-radius: 2px;
  overflow: hidden;
  margin-top: 8px;
}
.progress-fill {
  height: 100%;
  background: var(--pri);
  border-radius: 2px;
  transition: width .3s;
}

/* ── 유틸 ── */
.gap-8 { gap: 8px; }
.gap-12 { gap: 12px; }
.flex { display: flex; }
.flex-col { flex-direction: column; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.mt-8 { margin-top: 8px; }
.mt-12 { margin-top: 12px; }
.mt-16 { margin-top: 16px; }
.mb-8 { margin-bottom: 8px; }
.mb-12 { margin-bottom: 12px; }
.text-sm { font-size: 12px; }
.text-xs { font-size: 11px; }
.text-fg2 { color: var(--fg2); }
.text-fg3 { color: var(--fg3); }
.w-full { width: 100%; }
.hidden { display: none !important; }
</style>
</head>
<body>

<div class="app" id="app">
  <!-- 헤더 -->
  <header class="header">
    <div class="logo">✈ TravelBlog Pro</div>
    <div class="steps" id="steps">
      <button class="step-btn active" data-step="1">1. 사진 업로드</button>
      <button class="step-btn" data-step="2">2. 계획 검수</button>
      <button class="step-btn" data-step="3">3. AI 생성</button>
      <button class="step-btn" data-step="4">4. 편집</button>
      <button class="step-btn" data-step="5">5. 발행</button>
    </div>
    <div class="status-pill" id="statusPill">준비</div>
  </header>

  <!-- 좌측: 편집 패널 -->
  <div class="editor">
    <div class="editor-header">
      <span class="editor-title" id="editorTitle">📸 사진 업로드</span>
      <span class="editor-badge" id="editorBadge">STEP 1</span>
    </div>
    <div class="editor-body" id="editorBody">
      <!-- 동적 콘텐츠 -->
    </div>
  </div>

  <!-- 우측: 미리보기 -->
  <div class="preview">
    <div class="preview-header">
      <span class="preview-title">미리보기</span>
      <span class="preview-badge" id="previewBadge">실시간</span>
    </div>
    <div class="preview-body" id="previewBody">
      <div class="preview-content" id="previewContent">
        <div style="text-align:center;padding:80px 40px;color:#9ca3af">
          <p style="font-size:48px;margin-bottom:16px">✈</p>
          <p style="font-size:16px;font-weight:500">사진을 업로드하면<br>여기에 블로그 미리보기가 표시됩니다</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 로딩 오버레이 -->
<div class="loading-overlay hidden" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-text" id="loadingText">처리 중...</div>
  <div class="progress-bar" style="width:200px;margin-top:12px">
    <div class="progress-fill" id="loadingProgress" style="width:0%"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════
// TravelBlog Pro — Web Client
// ═══════════════════════════════════════

const API = '';  // same origin

// ── 상태 ──
let currentStep = 1;
let photos = [];
let groups = [];
let drafts = [];
let blocks = [];
let selectedBlockIdx = -1;
let currentGroupIdx = 0;
let currentDraftIdx = 0;
let draftTitle = '';
let draftTags = [];
let tripTitle = '';           // 여행 제목 (STEP 2)
let selectedMode = 'by_place'; // 그루핑 모드
let placeMemos = {};          // 장소별 메모
let routeModes = {};          // 이동경로 수단 {"A→B": "transit"}
let refUrls = [];
let pollTimer = null;

// ── DOM ──
const $editorBody = document.getElementById('editorBody');
const $editorTitle = document.getElementById('editorTitle');
const $editorBadge = document.getElementById('editorBadge');
const $previewContent = document.getElementById('previewContent');
const $statusPill = document.getElementById('statusPill');
const $loadingOverlay = document.getElementById('loadingOverlay');
const $loadingText = document.getElementById('loadingText');
const $loadingProgress = document.getElementById('loadingProgress');

// ── 스텝 네비게이션 ──
document.querySelectorAll('.step-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const step = parseInt(btn.dataset.step);
    goStep(step);
  });
});

function goStep(n) {
  currentStep = n;
  document.querySelectorAll('.step-btn').forEach(b => {
    b.classList.remove('active');
    if (parseInt(b.dataset.step) === n) b.classList.add('active');
  });
  renderStep();
}

// ── 로딩 ──
function showLoading(msg) {
  $loadingOverlay.classList.remove('hidden');
  $loadingText.textContent = msg;
  $loadingProgress.style.width = '0%';
}
function hideLoading() {
  $loadingOverlay.classList.add('hidden');
  stopPoll();
}
function setStatus(text, busy=false) {
  $statusPill.textContent = text;
  $statusPill.classList.toggle('busy', busy);
}

// ── 폴링 ──
function startPoll(onDone) {
  stopPoll();
  pollTimer = setInterval(async () => {
    const res = await fetch(`${API}/api/status`);
    const data = await res.json();
    const p = data.progress;
    $loadingText.textContent = p.message;
    $loadingProgress.style.width = p.percent + '%';
    setStatus(p.message, p.status !== 'done' && p.status !== 'error' && p.status !== 'idle');
    if (p.status === 'done' || p.status === 'error') {
      hideLoading();
      if (onDone) onDone(p);
    }
  }, 800);
}
function stopPoll() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

// ═══════════════════════════════════════
// STEP 렌더링
// ═══════════════════════════════════════

function renderStep() {
  switch (currentStep) {
    case 1: renderStep1(); break;
    case 2: renderStep2(); break;
    case 3: renderStep3(); break;
    case 4: renderStep4(); break;
    case 5: renderStep5(); break;
  }
}

// ── STEP 1: 사진 업로드 ──
function renderStep1() {
  $editorTitle.textContent = '📸 사진 업로드';
  $editorBadge.textContent = 'STEP 1';

  $editorBody.innerHTML = `
    <div class="dropzone" id="dropzone">
      <div class="dropzone-icon">📁</div>
      <div class="dropzone-text">클릭하여 여행 사진을 선택하거나<br>여기에 드래그 & 드롭</div>
    </div>
    <input type="file" id="fileInput" multiple accept="image/*" style="display:none">
    <div id="uploadedPhotos" class="mt-12"></div>
    <button class="btn btn-pri w-full mt-12 hidden" id="analyzeBtn" onclick="doAnalyze()">
      🔍 사진 분석 시작
    </button>
  `;

  const fileInput = document.getElementById('fileInput');
  const dropzone = document.getElementById('dropzone');

  // 클릭 → 파일 선택
  dropzone.addEventListener('click', (e) => {
    e.stopPropagation();
    fileInput.click();
  });

  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length) uploadFiles(e.target.files);
  });

  dropzone.addEventListener('dragover', (e) => {
    e.preventDefault();
    e.stopPropagation();
    dropzone.style.borderColor = 'var(--pri)';
    dropzone.style.background = 'var(--pri-glow)';
  });
  dropzone.addEventListener('dragleave', (e) => {
    e.preventDefault();
    dropzone.style.borderColor = '';
    dropzone.style.background = '';
  });
  dropzone.addEventListener('drop', (e) => {
    e.preventDefault();
    e.stopPropagation();
    dropzone.style.borderColor = '';
    dropzone.style.background = '';
    if (e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files);
  });
}

async function uploadFiles(files) {
  if (!files.length) return;

  // 이미지 파일만 필터
  const imageFiles = Array.from(files).filter(f =>
    f.type.startsWith('image/') || /\.(jpg|jpeg|png|gif|webp|heic)$/i.test(f.name)
  );
  if (!imageFiles.length) {
    alert('이미지 파일을 선택해주세요');
    return;
  }

  setStatus(`${imageFiles.length}장 업로드 중...`, true);

  // 즉시 로컬 썸네일 미리보기 (서버 응답 전)
  const container = document.getElementById('uploadedPhotos');
  container.innerHTML = `<div class="card-label">${imageFiles.length}장 업로드 중...</div><div class="photo-grid" id="thumbGrid"></div>`;
  const thumbGrid = document.getElementById('thumbGrid');

  for (const f of imageFiles) {
    const url = URL.createObjectURL(f);
    thumbGrid.innerHTML += `
      <div class="photo-thumb selected">
        <img src="${url}">
        <div class="photo-name">${f.name}</div>
      </div>`;
  }

  // 서버 업로드
  const formData = new FormData();
  for (const f of imageFiles) formData.append('photos', f);

  try {
    const res = await fetch(`${API}/api/upload`, { method: 'POST', body: formData });
    if (!res.ok) throw new Error(`서버 오류 (${res.status})`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    setStatus(`✅ ${data.uploaded}장 업로드 완료`);
    container.querySelector('.card-label').textContent = `${data.uploaded}장 업로드 완료`;
    document.getElementById('analyzeBtn').classList.remove('hidden');

  } catch (err) {
    setStatus(`❌ 업로드 실패`);
    container.innerHTML = `
      <div class="card" style="border-color:var(--err)">
        <div style="color:var(--err);font-size:13px">
          ❌ 업로드 실패: ${escHtml(err.message)}<br>
          <span class="text-fg3 text-xs">서버가 실행 중인지 확인하세요: python app.py</span>
        </div>
      </div>`;
    console.error('Upload error:', err);
  }
}

async function doAnalyze() {
  showLoading('사진 분석 중...');
  await fetch(`${API}/api/analyze`, { method: 'POST' });
  startPoll(async (p) => {
    if (p.status === 'done') {
      const res = await fetch(`${API}/api/photos`);
      photos = await res.json();
      goStep(2);
    }
  });
}

// ── STEP 2: 계획 검수 ──
function renderStep2() {
  $editorTitle.textContent = '🗂 계획 검수';
  $editorBadge.textContent = 'STEP 2';

  $editorBody.innerHTML = `
    <div id="planBanner" style="display:none;padding:8px 12px;margin-bottom:10px;background:#5a3a3a;color:#ffd;border-radius:6px;">무료 모드 — 상호명 정확도 낮음, 검수 권장</div>
    <div id="planRoot"></div>
    <button class="btn btn-pri w-full mt-16" onclick="nextFromPlan()">다음: AI 생성 →</button>
  `;

  loadPlan();
}

async function loadPlan() {
  let r = await fetch('/api/plan'); let plan = await r.json();
  if (!plan.days) {
    r = await fetch('/api/plan/draft', {method:'POST',
        headers:{'Content-Type':'application/json'}, body:'{"overwrite":true}'});
    if (!r.ok) { document.getElementById('planRoot').textContent = '계획 생성 실패 — 사진 분석을 먼저 하세요.'; return; }
    plan = await r.json();
  }
  window._plan = plan;
  const banner = document.getElementById('planBanner');
  banner.style.display = plan.free_mode ? 'block' : 'none';
  renderPlan(plan);
}

function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function renderPlan(plan) {
  const root = document.getElementById('planRoot');
  if (!plan.days || !plan.days.length) { root.textContent = '계획이 비어 있습니다.'; return; }
  root.innerHTML = plan.days.map(d => `
    <section class="day" style="margin-bottom:16px;">
      <h3>Day ${esc(d.day_no)} (${esc(d.date) || '날짜 미상'})</h3>
      ${d.stops.map(s => stopCard(s)).join('')}
    </section>`).join('');
}

function stopCard(s) {
  return `<div class="stop" data-stop="${esc(s.stop_id)}" style="border:1px solid #444;border-radius:8px;padding:10px;margin:8px 0;">
    <input class="f-name" value="${esc(s.name)}" placeholder="장소 이름" style="width:100%;margin-bottom:6px;">
    <textarea class="f-events" placeholder="핵심 사건(줄바꿈으로 여러 개)" style="width:100%;">${esc((s.events||[]).join('\n'))}</textarea>
    <textarea class="f-feeling" placeholder="느낀점/분위기" style="width:100%;">${esc(s.feeling)}</textarea>
    <input class="f-ai" value="${esc(s.ai_instruction)}" placeholder="AI 작성 지시(선택)" style="width:100%;margin-bottom:6px;">
    <input class="f-rating" type="number" min="0" max="5" step="0.5" value="${s.rating==null?'':esc(s.rating)}" placeholder="별점" style="width:80px;">
    <span class="ph-count" style="margin-left:10px;color:#aaa;">사진 ${(s.photo_ids||[]).length}장</span>
    <div style="margin-top:6px;font-size:13px;">
      🧾 <input type="file" accept="image/*"
         onchange="if(this.files[0])uploadReceipt('${esc(s.stop_id)}', this.files[0])">
      <span class="receipt-info" style="color:#9c9;">${s.receipt ? esc(receiptText(s.receipt)) : ''}</span>
    </div>
  </div>`;
}

function receiptText(r) {
  if (!r) return '';
  const amt = r.amount != null ? ` ${r.currency||''}${r.amount}` : '';
  return `${r.store_name||''}${amt}`.trim();
}

function findStop(plan, sid) {
  for (const d of plan.days) for (const s of d.stops) if (s.stop_id === sid) return s;
  return null;
}

function collectPlan() {
  if (!window._plan) return;
  document.querySelectorAll('.stop').forEach(el => {
    const s = findStop(window._plan, el.dataset.stop);
    if (!s) return;
    s.name = el.querySelector('.f-name').value.trim();
    s.name_source = s.name ? 'user' : 'none';
    s.events = el.querySelector('.f-events').value.split('\n').map(x => x.trim()).filter(Boolean);
    s.feeling = el.querySelector('.f-feeling').value.trim();
    s.ai_instruction = el.querySelector('.f-ai').value.trim();
    const rv = el.querySelector('.f-rating').value;
    s.rating = rv === '' ? null : parseFloat(rv);
  });
}

async function savePlan() {
  collectPlan();
  await fetch('/api/plan', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(window._plan)});
}

async function reloadPlan() {
  const r = await fetch('/api/plan');
  window._plan = await r.json();
  renderPlan(window._plan);
}

async function uploadReceipt(stopId, file) {
  await savePlan();                       // persist current text edits first (so reload won't lose them)
  const fd = new FormData(); fd.append('stop_id', stopId); fd.append('receipt', file);
  const r = await fetch('/api/plan/receipt', {method:'POST', body: fd});
  const j = await r.json();
  if (j && j.suggest_name) {
    alert('영수증 가게명이 장소명과 비슷합니다 — 반영을 검토하세요: ' + ((j.receipt&&j.receipt.store_name)||''));
  }
  await reloadPlan();
}

async function nextFromPlan() {
  await savePlan();
  goStep(3);
}

                         border:1px solid var(--bd);border-radius:4px;color:var(--fg)">

        </div>
      </div>`;

    html += `<div class="card" style="padding:10px 12px;margin-bottom:2px">
      <div class="flex items-center gap-8 mb-8">
        <span style="color:var(--olive);font-size:11px;font-weight:600;letter-spacing:1px">PLACE ${pi+1}</span>
        <span class="text-xs text-fg3">${pg.items.length}장</span>

        <div style="width:50px;height:50px;border-radius:6px;overflow:hidden;flex-shrink:0">
          ${photo.thumbnail
            ?`<img src="${photo.thumbnail}" style="width:100%;height:100%;object-fit:cover">`
            :'<div style="background:var(--sf3);width:100%;height:100%"></div>'}

// 장소 그룹 전체 이름 변경
function renamePlaceGroup(groupIdx, newName) {
  newName = newName.trim();
  if (!newName) return;
  // 해당 그룹의 사진들 찾기
  let prevPlace = null, gi = -1;
  const targets = [];
  photos.forEach((p, i) => {
    const loc = p.location_name || '미확인';
    if (loc !== prevPlace) { gi++; prevPlace = loc; }
    if (gi === groupIdx) targets.push(i);
  });
  const oldName = targets.length ? photos[targets[0]].location_name : '';
  if (oldName === newName) return;

  targets.forEach(i => { photos[i].location_name = newName; });

  // 메모/경로 이관
  if (placeMemos[oldName]) { placeMemos[newName] = placeMemos[oldName]; delete placeMemos[oldName]; }
  const newRM = {};
  for (const [k,v] of Object.entries(routeModes)) { newRM[k.replace(oldName,newName)] = v; }
  Object.keys(routeModes).forEach(k => delete routeModes[k]);
  Object.assign(routeModes, newRM);

  fetch(`${API}/api/photos/rename`,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({old_name:oldName,new_name:newName})}).catch(()=>{});
  renderPhotoEditList();
  loadGroups();
}

// 개별 사진 장소명 변경
function updateSinglePhoto(idx, newName) {
  newName = newName.trim();
  if (!newName || idx<0 || idx>=photos.length) return;
  photos[idx].location_name = newName;
  fetch(`${API}/api/photos/update`,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({index:idx,location_name:newName})}).catch(()=>{});
  renderPhotoEditList();
  loadGroups();
}

function addRefUrl() {
  const input = document.getElementById('refUrlInput');

  if (!url) return;
  if (!url.startsWith('http')) {
    alert('URL은 http:// 또는 https://로 시작해야 합니다');
    return;
  }
  if (refUrls.includes(url)) {

async function doStyleAnalysis() {
  if (!refUrls.length) {
    alert('참고 블로그 URL을 1개 이상 추가해주세요');
    return;
  }
  setStatus('스타일 분석 중...', true);
  try {
    const res = await fetch(`${API}/api/style`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({urls: refUrls})
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    setStatus(`✅ ${refUrls.length}개 블로그 스타일 분석 완료`);

    setStatus(`❌ 스타일 분석 실패: ${err.message}`);

// ── STEP 4: 블록 편집 (핵심!) ──
function renderStep4() {
  $editorTitle.textContent = '✏️ 블록 편집';
  $editorBadge.textContent = `${blocks.length}개 블록`;

  let html = `
    <div class="card">
      <div class="card-label">제목</div>
      <input type="text" id="blockTitle" value="${escHtml(draftTitle)}"
             oninput="draftTitle=this.value; updatePreview()">
    </div>
  `;

  if (drafts.length > 1) {
    html += `<div class="flex gap-8 mb-12">` +
      drafts.map((d, i) => `
        <button class="btn ${i === currentDraftIdx ? 'btn-pri' : 'btn-ghost'} btn-sm"
                onclick="loadBlocks(${i})">초안 ${i+1}</button>
      `).join('') + '</div>';
  }

  html += `<div class="flex gap-8 mb-12">
    <button class="btn btn-ghost btn-sm" onclick="addBlock('text')">+ 텍스트</button>
    <button class="btn btn-ghost btn-sm" onclick="addBlock('separator')">+ 구분선</button>
  </div>`;

  html += '<div id="blockList">';
  blocks.forEach((b, i) => {
    const sel = i === selectedBlockIdx;
    const typeLabel = {
      text: '📝', image: '🖼', separator: '─', styled_label: '🏷',
      heading: '📌', route: '🗺', map_link: '📍'
    }[b.type] || '?';

    let preview = '';
    if (b.type === 'text') preview = (b.content || '').substring(0, 60);
    else if (b.type === 'image') preview = '(이미지)';
    else if (b.type === 'separator') preview = '─ ─ ─ ─ ─';
    else if (b.type === 'styled_label') preview = b.content || '';
    else if (b.type === 'heading') preview = b.content || '';
    else if (b.type === 'route') preview = (b.content || '').substring(0, 50);
    else if (b.type === 'map_link') preview = b.content || '';

    html += `
      <div class="block-item ${sel ? 'selected' : ''}" onclick="selectBlock(${i})">
        <div class="block-type">${typeLabel} ${b.type}</div>
        <div class="block-content">${escHtml(preview)}</div>
        <div class="block-actions">
          <button class="block-act" onclick="event.stopPropagation();moveBlock(${i},-1)" title="위로">↑</button>
          <button class="block-act" onclick="event.stopPropagation();moveBlock(${i},1)" title="아래">↓</button>
          <button class="block-act" onclick="event.stopPropagation();deleteBlock(${i})" title="삭제">×</button>
        </div>
      </div>
    `;
  });
  html += '</div>';

  // 선택된 블록 편집 영역
  if (selectedBlockIdx >= 0 && selectedBlockIdx < blocks.length) {
    const b = blocks[selectedBlockIdx];
    if (b.type === 'text' || b.type === 'styled_label' || b.type === 'heading' || b.type === 'route') {
      html += `
        <div class="card mt-12">
          <div class="card-label">블록 편집 #${selectedBlockIdx + 1}</div>
          <textarea class="edit-area" id="blockEditArea"
                    oninput="editBlock(this.value)">${escHtml(b.content || '')}</textarea>
        </div>
      `;
    }
  }

  html += `
    <div class="flex gap-8 mt-16">
      <button class="btn btn-ok" onclick="goStep(5)">발행 준비 →</button>
    </div>
  `;

  $editorBody.innerHTML = html;
}

function selectBlock(i) {
  selectedBlockIdx = i;
  renderStep4();
  // 미리보기에서 해당 블록 하이라이트
  highlightPreviewBlock(i);
}

function editBlock(value) {
  if (selectedBlockIdx >= 0 && selectedBlockIdx < blocks.length) {
    blocks[selectedBlockIdx].content = value;
    updatePreview();
  }
}

function moveBlock(i, dir) {
  const j = i + dir;
  if (j < 0 || j >= blocks.length) return;
  [blocks[i], blocks[j]] = [blocks[j], blocks[i]];
  if (selectedBlockIdx === i) selectedBlockIdx = j;
  else if (selectedBlockIdx === j) selectedBlockIdx = i;
  renderStep4();
  updatePreview();
}

function deleteBlock(i) {
  blocks.splice(i, 1);
  if (selectedBlockIdx >= blocks.length) selectedBlockIdx = blocks.length - 1;
  renderStep4();
  updatePreview();
}

function addBlock(type) {
  const idx = selectedBlockIdx >= 0 ? selectedBlockIdx + 1 : blocks.length;
  if (type === 'text') {
    blocks.splice(idx, 0, {type: 'text', content: '(새 텍스트를 입력하세요)'});
  } else if (type === 'separator') {
    blocks.splice(idx, 0, {type: 'separator'});
  }
  selectedBlockIdx = idx;
  renderStep4();
  updatePreview();
}

      </button>
      <button class="btn btn-ghost w-full" onclick="doSave()">
        💾 로컬 저장
      </button>
    </div>
  `;
}

async function doPublish() {
  const title = document.getElementById('pubTitle')?.value || draftTitle;
  const tagsStr = document.getElementById('pubTags')?.value || '';
  const tags = tagsStr.split(',').map(t => t.trim()).filter(Boolean);
  const visibility = document.getElementById('pubVisibility')?.value || '비공개';

  showLoading('네이버 블로그 발행 중...');
  await fetch(`${API}/api/publish`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ title, blocks, tags, visibility })
  });
  startPoll((p) => {
    if (p.status === 'done') alert('✅ 발행 완료!');
    else if (p.status === 'error') alert(p.message);
  });
}

async function doSave() {
  // 미리보기 HTML을 저장
  const html = $previewContent.innerHTML;
  const res = await fetch(`${API}/api/save`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ title: draftTitle, content: html, tags: draftTags })
  });
  const data = await res.json();
  alert(data.saved_to ? `저장 완료: ${data.saved_to}` : '저장 실패');
}

// ═══════════════════════════════════════
// 미리보기 업데이트
// ═══════════════════════════════════════

async function updatePreview() {
  const res = await fetch(`${API}/api/preview`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ blocks, title: draftTitle })
  });
  const data = await res.json();

  // 제목 + 본문
  let html = '';
  if (draftTitle) {
    html += `<h1 style="text-align:center;font-size:1.5em;color:#1f2937;
             font-weight:700;margin-bottom:24px;padding-bottom:16px;
             border-bottom:1px solid #e5e7eb">${escHtml(draftTitle)}</h1>`;
  }
  html += data.html;
  $previewContent.innerHTML = html;
}

function highlightPreviewBlock(idx) {
  // 간단한 스크롤: 블록 개수 기반으로 대략적 위치 계산
  const previewEl = document.getElementById('previewBody');
  if (!previewEl) return;
  const totalH = previewEl.scrollHeight;
  const ratio = idx / Math.max(blocks.length, 1);
  previewEl.scrollTop = totalH * ratio - 100;
}

// ── 유틸 ──
function escHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── 초기화 ──
renderStep1();
</script>
